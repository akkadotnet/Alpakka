parameters:
  name: ''
  displayName: ''
  vmImage: ''
  scriptFileName: ''
  scriptArgs: 'all'
  outputDirectory : ''
  artifactName: ''
  timeoutInMinutes: 120
  amqpTestUseDocker : false # Flag for Akka.Streams.Azure.StorageQueue.Test to use docker

jobs:
  - job: ${{ parameters.name }}
    displayName: ${{ parameters.displayName }}
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    pool:
      vmImage: ${{ parameters.vmImage }}
    variables:
      Alpakka_AMQP_Test_UseDocker: ${{ parameters.amqpTestUseDocker }}
    steps:
      - checkout: self  # self represents the repo where the initial Pipelines YAML file was found
        clean: false  # whether to fetch clean each time
        submodules: recursive  # set to 'true' for a single level of submodules or 'recursive' to get submodules of submodules
        persistCredentials: true

      - task: UseDotNet@2
        displayName: 'Use .NET'
        inputs:
          packageType: 'sdk'
          useGlobalJson: true
          
      - script: dotnet tool restore
        displayName: 'Restore dotnet tools'

      - pwsh: |
          . ./scripts/Create-DirectoryTree.ps1 # Source the script
          Ensure-DirectoryPath -Path "${{ parameters.outputDirectory }}"
          Ensure-DirectoryPath -Path "bin/output"
        displayName: 'Ensure output directories'

      - pwsh: |
          .\build.ps1
        displayName: 'Update Release Notes'
        continueOnError: false

      - script: dotnet build -c Release
        displayName: 'dotnet build'
        continueOnError: false

      # Linux
      # Install Azurite in linux
      - bash: |
          sudo npm install -g azurite@3.26.0
          sudo mkdir azurite
          sudo azurite --silent --location azurite --debug azirute/debug.log &
        displayName: 'Install and Run Azurite (Linux)'
        condition: in( variables['Agent.OS'], 'Linux', 'Darwin' )
      
      # Do build
      - script: dotnet incrementalist run --config .incrementalist/testsOnly.json -- test -c Release --no-build --framework net10.0 --logger:trx --collect:"XPlat Code Coverage" --results-directory TestResults --settings coverlet.runsettings
        displayName: 'Run Tests (Linux)'
        continueOnError: true
        condition: in( variables['Agent.OS'], 'Linux', 'Darwin' )

      # Windows
      # Start Azure Storage Emulator in windows
      - powershell: |
          npm install -g azurite@3.26.0
          mkdir azurite
          Start-Process azurite.cmd -PassThru
        displayName: 'Install and Run Azurite (Windows)'
        condition: eq( variables['Agent.OS'], 'Windows_NT' )
      
      # Do build
      - script: dotnet incrementalist run --config .incrementalist/testsOnly.json -- test -c Release --no-build --logger:trx --collect:"XPlat Code Coverage" --results-directory TestResults --settings coverlet.runsettings
        displayName: 'Run Tests (Windows)'
        continueOnError: true
        condition: eq( variables['Agent.OS'], 'Windows_NT' )

      - task: PublishTestResults@2
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: '**/*.trx' #TestResults folder usually
          testRunTitle: ${{ parameters.name }}
          mergeTestResults: true
          failTaskOnFailedTests: false
          publishRunAttachments: true

      # Check if coverage files exist before running report generator
      - pwsh: |
          $coverageFiles = Get-ChildItem -Path "$(Build.SourcesDirectory)/TestResults" -Filter "*.cobertura.xml" -Recurse -ErrorAction SilentlyContinue
          if ($coverageFiles -and $coverageFiles.Count -gt 0) {
            Write-Host "Found $($coverageFiles.Count) coverage file(s)"
            Write-Host "##vso[task.setvariable variable=HasCoverageFiles]true"
          } else {
            Write-Host "No coverage files found - skipping report generation"
            Write-Host "##vso[task.setvariable variable=HasCoverageFiles]false"
          }
        displayName: 'Check for coverage files'
        condition: always()

      - task: reportgenerator@5
        displayName: ReportGenerator
        condition: and(always(), eq(variables['HasCoverageFiles'], 'true'))
        continueOnError: true
        inputs:
          reports: '$(Build.SourcesDirectory)/TestResults/**/*.cobertura.xml'
          targetdir: '$(Build.SourcesDirectory)/coveragereport'
          reporttypes: 'HtmlInline_AzurePipelines;Cobertura;Badges'
          assemblyfilters: '-xunit*'
          publishCodeCoverageResults: true

      - publish: $(Build.SourcesDirectory)/coveragereport
        displayName: 'Publish Coverage Report'
        condition: and(always(), eq(variables['Agent.OS'], 'Windows_NT'), eq(variables['HasCoverageFiles'], 'true'))
        continueOnError: true
        artifact: 'CoverageReports-$(Build.BuildId)'
          
      - script: dotnet pack -c Release -o $(Build.ArtifactStagingDirectory)/nuget
        displayName: 'Create packages'
          
      - task: PublishBuildArtifacts@1
        displayName: 'Publish artifacts'
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)/nuget'
          ArtifactName: 'nuget-$(Build.BuildId)'
          publishLocation: 'Container'

      - script: 'echo 1>&2'
        failOnStderr: true
        displayName: 'If above is partially succeeded, then fail'
        condition: eq(variables['Agent.JobStatus'], 'SucceededWithIssues')