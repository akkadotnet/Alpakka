jobs:
- job: documentation_validation
  displayName: Build documentation
  timeoutInMinutes: 30
  pool:
    vmImage: windows-latest
  steps:
  - checkout: self  # self represents the repo where the initial Pipelines YAML file was found
    clean: false  # whether to fetch clean each time
    submodules: recursive  # set to 'true' for a single level of submodules or 'recursive' to get submodules of submodules
    persistCredentials: true

  - task: UseDotNet@2
    displayName: 'Install the SDK and ASP.NET runtime required by pinned DocFX'
    inputs:
      packageType: 'sdk'
      version: '9.0.x'

  - task: UseDotNet@2
    displayName: 'Use repository .NET SDK'
    inputs:
      packageType: 'sdk'
      useGlobalJson: true
      
  - task: DotNetCoreCLI@2
    displayName: 'Restore .NET tools'
    inputs:
      command: 'custom'
      custom: 'tool'
      arguments: 'restore'

  - pwsh: |
      Get-ChildItem docs/api -Filter '*.yml' | Remove-Item
      dotnet docfx metadata ./docs/docfx.json
      if ($LASTEXITCODE -ne 0) { throw 'API metadata generation failed.' }
      $metadata = (Get-ChildItem docs/api -Filter '*.yml' | Get-Content -Raw) -join "`n"
      $assemblies = @(
        'Akka.Streams.Amqp.V1', 'Akka.Streams.Amqp.RabbitMq',
        'Akka.Streams.Azure.EventHub', 'Akka.Streams.Azure.ServiceBus', 'Akka.Streams.Azure.StorageQueue',
        'Akka.Streams.Kinesis', 'Akka.Streams.Sns', 'Akka.Streams.SQS',
        'Akka.Streams.Csv', 'Akka.Streams.File', 'Akka.Streams.SignalR', 'Akka.Streams.Xml'
      )
      foreach ($assembly in $assemblies) {
        if ($metadata -notmatch "(?m)^  assemblies:\r?\n  - $([regex]::Escape($assembly))\r?$") {
          throw "No generated API metadata for $assembly"
        }
      }
      dotnet docfx build ./docs/docfx.json --warningsAsErrors
      if ($LASTEXITCODE -ne 0) { throw 'Documentation rendering failed.' }
    displayName: 'docfx build'

  - task: ArchiveFiles@2
    displayName: Archive files
    inputs:
      rootFolderOrFile: '$(Build.SourcesDirectory)/docs/_site'
      includeRootFolder: false
      archiveType: zip
      archiveFile: '$(Build.ArtifactStagingDirectory)/documentation.zip'
  - task: PublishBuildArtifacts@1
    displayName: 'Publish Artifact: drop'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/documentation.zip'
      ArtifactName: documentation
