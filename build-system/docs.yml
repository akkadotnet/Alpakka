trigger:
  branches:
    include:
    - dev
  batch: True
name: $(date:yyyyMMdd)$(rev:.r)

pr:
  branches:
    include:
    - dev
  paths:
    include:
    - README.md
    - docs/**
    - src/**
    - Directory.Build.props
    - Directory.Packages.props
    - global.json
    - .config/dotnet-tools.json
    - build-system/docs.yml

jobs:
- template: docs-job.template.yaml
