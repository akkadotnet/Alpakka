# Pull request validation for Windows against the `dev` and `master` branches
# See https://docs.microsoft.com/en-us/azure/devops/pipelines/yaml-schema for reference
trigger:
  branches:
    include:
      - dev
      - v1.*
      - master
      - feature/*

pr:
  autoCancel: true # indicates whether additional pushes to a PR should cancel in-progress runs for the same PR. Defaults to true
  branches:
    include: [ dev, v1.*, master, feature/* ] # branch names which will trigger a build

name: $(Year:yyyy).$(Month).$(DayOfMonth)$(Rev:.r)

jobs:
  - template: azure-pipeline.template.yaml
    parameters:
      name: 'net_tests_linux'
      displayName: '.NET Unit Tests (Linux)'
      vmImage: 'ubuntu-latest'
      scriptFileName: './build.sh'
      scriptArgs: runTestsNet
      outputDirectory: 'TestResults'
      artifactName: 'net_tests_linux-$(Build.BuildId)'
      amqpTestUseDocker: true # Flag for AQMP test to use RabbitMQ docker
  - job: rabbitmq_validation
    displayName: 'RabbitMQ integration and compatibility'
    timeoutInMinutes: 30
    strategy:
      matrix:
        linux:
          image: ubuntu-latest
        windows:
          image: windows-latest
    pool:
      vmImage: $(image)
    steps:
      - checkout: self
      - task: UseDotNet@2
        inputs:
          packageType: sdk
          useGlobalJson: true
      - pwsh: |
          dotnet build src/Amqp/Akka.Streams.Amqp.RabbitMq.Tests/Akka.Streams.Amqp.RabbitMq.Tests.csproj -c Release --framework net48
          if ($LASTEXITCODE -ne 0) { throw '.NET Framework test compilation failed.' }
        displayName: 'Compile retained .NET Framework test target'
        condition: eq(variables['Agent.OS'], 'Windows_NT')
      - pwsh: |
          dotnet test src/Amqp/Akka.Streams.Amqp.RabbitMq.Tests/Akka.Streams.Amqp.RabbitMq.Tests.csproj -c Release --framework net10.0 --filter FullyQualifiedName~Akka.Streams.Amqp.Tests --logger "trx;LogFileName=rabbitmq.trx" --results-directory RabbitMqResults
          if ($LASTEXITCODE -ne 0) { throw 'RabbitMQ tests failed.' }
        displayName: 'Run RabbitMQ integration tests'
        condition: eq(variables['Agent.OS'], 'Linux')
      - pwsh: |
          [xml]$trx = Get-Content RabbitMqResults/rabbitmq.trx -Raw
          $results = @($trx.TestRun.Results.UnitTestResult)
          $required = @{
            Publish_and_consume_elements_through_a_simple_queue_again_in_the_same_process = 1
            Publish_via_RPC_and_then_consume_through_a_simple_queue_again_in_the_same_process = 1
            Publish_via_RPC_which_expects_2_responses_per_message_and_then_consume_through_a_simple_queue_again_in_the_same_process = 1
            Correctly_close_a_AmqpRpcFlow_when_stream_is_closed_without_passing_any_elements = 1
            Handle_missing_reply_to_header_correctly = 1
            Not_fail_on_a_fast_producer_and_a_slow_consumer = 1
            Pub_sub_from_one_source_with_multiple_sinks = 1
            Publish_and_consume_elements_through_a_simple_queue_again_in_the_same_process_without_autoAck = 1
            Republish_message_without_autoAck_if_nack_is_sent = 1
            Keep_connection_open_if_downstream_closes_and_there_are_pending_acks = 1
            Not_republish_message_without_autoAck_false_if_nack_is_sent = 1
            Publish_via_RPC_and_then_consume_through_a_simple_queue_again_in_the_same_process_without_autoAck = 1
            Set_routing_key_per_message_and_consume_them_in_the_same_process = 1
            Publish_from_one_source_and_consume_elements_with_multiple_sinks = 1
            Publish_elements_with_flow_then_consume_them_with_source = 1
            Correctly_close_a_AmqpFlow_when_stream_is_closed_without_passing_any_elements = 1
            Set_routing_key_per_message_while_publishing_with_flow_and_consume_them_in_the_same_process = 1
            Declare_connection_that_does_not_require_server_acks = 1
            Durable_queues_interoperate_on_stock_broker_and_cancelled_deliveries_can_be_nacked_before_shutdown = 1
            AmqpSink_should_publish_messages_with_confirms = 1
            A_blocked_broker_cannot_complete_a_publish_requiring_confirmation = 1
            AmqpFlow_should_publish_messages_with_confirms = 1
          }
          if ($results.Count -eq 0 -or @($results | Where-Object outcome -ne Passed).Count -gt 0) {
            throw 'Every discovered test must execute and pass; empty or skipped runs are invalid.'
          }
          if (@($results.testName | Select-Object -Unique).Count -ne $results.Count) {
            throw 'Duplicate test cases cannot replace required coverage.'
          }
          foreach ($case in $required.GetEnumerator()) {
            $matching = @($results | Where-Object testName -match "\.$($case.Key)(\(|$)")
            if ($matching.Count -ne $case.Value) { throw "Missing or duplicate cases for $($case.Key)." }
          }
        displayName: 'Require named cases and reject empty or skipped TRX runs'
        condition: eq(variables['Agent.OS'], 'Linux')
      - pwsh: |
          $consumer = 'compatibility/RabbitMqConsumer/RabbitMqCompatibilityConsumer.csproj'
          $framework = if ($IsWindows) { 'net48' } else { 'net10.0' }
          dotnet build $consumer -c Release --framework $framework
          if ($LASTEXITCODE -ne 0) { throw 'Old consumer compilation failed.' }
          $output = "compatibility/RabbitMqConsumer/bin/Release/$framework"
          $binary = if ($IsWindows) { "$output/RabbitMqCompatibilityConsumer.exe" } else { "$output/RabbitMqCompatibilityConsumer.dll" }
          $before = (Get-FileHash $binary).Hash
          $originalBinary = Join-Path '$(Agent.TempDirectory)' ([IO.Path]::GetFileName($binary))
          Copy-Item $binary $originalBinary -Force
          if ($IsWindows) { & $binary } else { dotnet $binary }
          if ($LASTEXITCODE -ne 0) { throw 'Released-package consumer execution failed.' }

          dotnet pack src/Amqp/Akka.Streams.Amqp.RabbitMq/Akka.Streams.Amqp.RabbitMq.csproj -c Release -p:PackageVersion=1.5.59-rabbitmq-validation -o RabbitMqPackages
          if ($LASTEXITCODE -ne 0) { throw 'Package creation or API/TFM validation failed.' }
          $feed = (Resolve-Path RabbitMqPackages).Path
          $candidateCache = Join-Path '$(Agent.TempDirectory)' ("rabbitmq-consumer-{0}-{1}-packages" -f $framework, [guid]::NewGuid().ToString('N'))
          # Resolve dependencies and binding configuration for the consumer's own TFM.
          dotnet build $consumer -c Release --framework $framework --force --no-incremental -p:RabbitMqConsumerPackageVersion=1.5.59-rabbitmq-validation "-p:RestoreAdditionalProjectSources=$feed" "-p:RestorePackagesPath=$candidateCache"
          if ($LASTEXITCODE -ne 0) { throw 'Consumer source is incompatible with the candidate package.' }
          $resolvedPackage = Join-Path $candidateCache 'akka.streams.amqp.rabbitmq/1.5.59-rabbitmq-validation/akka.streams.amqp.rabbitmq.1.5.59-rabbitmq-validation.nupkg'
          $builtPackage = Join-Path $feed 'Akka.Streams.Amqp.RabbitMq.1.5.59-rabbitmq-validation.nupkg'
          if ((Get-FileHash $resolvedPackage).Hash -ne (Get-FileHash $builtPackage).Hash) { throw 'Consumer resolved a different candidate package.' }
          $libraryFramework = if ($IsWindows) { 'netstandard2.0' } else { 'net6.0' }
          $candidate = "src/Amqp/Akka.Streams.Amqp.RabbitMq/bin/Release/$libraryFramework"
          Copy-Item $originalBinary $binary -Force
          if ((Get-FileHash $binary).Hash -ne $before) { throw 'Consumer was changed after compilation.' }
          if ((Get-FileHash "$output/Akka.Streams.Amqp.RabbitMq.dll").Hash -ne (Get-FileHash "$candidate/Akka.Streams.Amqp.RabbitMq.dll").Hash) {
            throw 'Consumer did not receive the candidate library.'
          }
          if ($IsWindows) { & $binary } else { dotnet $binary }
          if ($LASTEXITCODE -ne 0) { throw 'Previously compiled consumer failed with the candidate.' }
        displayName: 'Validate API/TFMs and run unchanged released-package consumer with candidate'
      - pwsh: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packages = @(Get-ChildItem RabbitMqPackages/*.nupkg)
          if ($packages.Count -ne 1) { throw 'Expected exactly one RabbitMQ package.' }
          $package = $packages[0]
          $archive = [IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $nuspecEntry = @($archive.Entries | Where-Object FullName -like '*.nuspec')
            if ($nuspecEntry.Count -ne 1) { throw 'Expected exactly one package manifest.' }
            $reader = [IO.StreamReader]::new($nuspecEntry[0].Open())
            try { [xml]$nuspec = $reader.ReadToEnd() } finally { $reader.Dispose() }
            if ($nuspec.package.metadata.id -ne 'Akka.Streams.Amqp.RabbitMq') { throw 'Unexpected package identity.' }
            $version = $nuspec.package.metadata.version
            $readmePath = [string]$nuspec.package.metadata.readme
            if (!$readmePath) { throw 'NuGet manifest does not declare a README.' }
            $entry = $archive.GetEntry($readmePath)
            if (!$entry) { throw 'README is absent from NuGet archive.' }
            $reader = [IO.StreamReader]::new($entry.Open())
            try { $readme = $reader.ReadToEnd() } finally { $reader.Dispose() }
            $sourceReadme = Get-Content src/Amqp/Akka.Streams.Amqp.RabbitMq/README.md -Raw
            if ($readme -cne $sourceReadme) { throw 'Packaged README differs from the source.' }
            foreach ($tfm in @('net6.0', 'netstandard2.0')) {
              if (!$archive.GetEntry("lib/$tfm/Akka.Streams.Amqp.RabbitMq.dll")) { throw "Missing retained TFM $tfm." }
            }
          } finally { $archive.Dispose() }

          $examples = [regex]::Matches($readme, '(?s)```csharp\r?\n(.*?)```')
          if ($examples.Count -ne 2) { throw 'Expected two complete README examples.' }
          $feed = [Security.SecurityElement]::Escape((Resolve-Path RabbitMqPackages).Path)
          $cache = [Security.SecurityElement]::Escape((Join-Path '$(Agent.TempDirectory)' ("rabbitmq-readme-{0}-packages" -f [guid]::NewGuid().ToString('N'))))
          for ($i = 0; $i -lt $examples.Count; $i++) {
            $directory = Join-Path '$(Agent.TempDirectory)' "rabbitmq-readme-$i"
            New-Item $directory -ItemType Directory -Force | Out-Null
            Set-Content "$directory/Program.cs" $examples[$i].Groups[1].Value
            Set-Content "$directory/Example.csproj" "<Project Sdk='Microsoft.NET.Sdk'><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable><RestoreSources>$feed;https://api.nuget.org/v3/index.json</RestoreSources><RestorePackagesPath>$cache</RestorePackagesPath></PropertyGroup><ItemGroup><PackageReference Include='Akka.Streams.Amqp.RabbitMq' Version='$version' /></ItemGroup></Project>"
            dotnet build "$directory/Example.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { throw "README example $i did not compile." }
          }
        displayName: 'Inspect NuGet README/TFMs and compile the shipped examples'
      - task: PublishTestResults@2
        condition: and(always(), eq(variables['Agent.OS'], 'Linux'))
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: RabbitMqResults/*.trx
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: true

