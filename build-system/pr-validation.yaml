# Pull request validation for Windows against the `dev` and `master` branches
# See https://docs.microsoft.com/en-us/azure/devops/pipelines/yaml-schema for reference
trigger:
  branches:
    include:
      - dev
      - v1.*
      - master
      - feature/*

pr:
  autoCancel: true # indicates whether additional pushes to a PR should cancel in-progress runs for the same PR. Defaults to true
  branches:
    include: [ dev, v1.*, master, feature/* ] # branch names which will trigger a build

name: $(Year:yyyy).$(Month).$(DayOfMonth)$(Rev:.r)

jobs:
  - template: azure-pipeline.template.yaml
    parameters:
      name: 'net_tests_linux'
      displayName: '.NET Unit Tests (Linux)'
      vmImage: 'ubuntu-latest'
      scriptFileName: './build.sh'
      scriptArgs: runTestsNet
      outputDirectory: 'TestResults'
      artifactName: 'net_tests_linux-$(Build.BuildId)'
      amqpTestUseDocker: true # Flag for AQMP test to use RabbitMQ docker
  - job: file_validation
    displayName: 'File integration and compatibility'
    timeoutInMinutes: 30
    strategy:
      matrix:
        linux:
          image: ubuntu-latest
          fileFramework: net10.0
          fileFilter: FullyQualifiedName~Akka.Streams.File.Tests
        windows:
          image: windows-latest
          fileFramework: net48
          fileFilter: Platform!=Linux
    pool:
      vmImage: $(image)
    steps:
      - checkout: self
      - task: UseDotNet@2
        inputs:
          packageType: sdk
          useGlobalJson: true
      - pwsh: |
          dotnet test src/File/Akka.Streams.File.Tests/Akka.Streams.File.Tests.csproj -c Release --framework "$(fileFramework)" --filter "$(fileFilter)" --logger "trx;LogFileName=file-final.trx" --results-directory FileResults
          if ($LASTEXITCODE -ne 0) { throw 'File tests failed.' }
        displayName: 'Run File required tests'
      - pwsh: |
          [xml]$trx = Get-Content FileResults/file-final.trx -Raw
          $results = @($trx.TestRun.Results.UnitTestResult)
          $required = @{
            A_current_sink_that_cancels_before_its_first_pull_completes_successfully = 1
            A_current_sink_that_completes_early_cancels_upstream_successfully = 1
            A_failed_or_canceled_final_sink_fails_the_materialized_task = 2
            A_missing_watch_directory_fails_instead_of_silently_completing = 1
            A_real_watcher_reports_rename_and_cancellation_terminates_the_source = 1
            A_rotated_factory_failure_terminates_the_previous_child = 1
            A_throwing_sink_factory_fails_the_materialized_task = 1
            Completing_a_rotated_sink_does_not_drop_other_sinks_or_stop_upstream = 1
            DirectoryChangesSource_should_emit_multiple_changes = 1
            DirectoryChangesSource_should_emit_on_directory_changes = 1
            Early_current_sink_completion_still_waits_for_every_older_sink = 2
            LogRotatorSink_must_complete_when_consuming_an_empty_source = 1
            LogRotatorSink_must_correctly_close_sinks = 1
            LogRotatorSink_must_downstream_fail_on_file_write = 1
            LogRotatorSink_must_function_fail_on_path_creation = 1
            LogRotatorSink_must_upstream_fail_after_first_file_creation = 1
            LogRotatorSink_must_upstream_fail_before_first_file_creation = 1
            LogRotatorSink_must_work_for_size_based_rotation = 1
            LogRotatorSink_must_work_for_time_based_rotation = 1
            LogRotatorSink_must_write_lines_to_a_single_file = 1
            LogRotatorSink_must_write_lines_to_multiple_files_due_to_fileSize = 1
            Materializer_shutdown_fails_a_pending_rotation_task = 1
            Rotation_preserves_utf8_bytes_file_modes_and_closes_every_file = 3
          }
          if (!$IsWindows) {
            $required['Cancellation_releases_the_native_inotify_watch_for_the_directory'] = 1
          }
          if ($results.Count -eq 0 -or @($results | Where-Object outcome -ne Passed).Count -gt 0) {
            throw 'Every discovered test must execute and pass; empty or skipped runs are invalid.'
          }
          if (@($results.testName | Select-Object -Unique).Count -ne $results.Count) {
            throw 'Duplicate test cases cannot replace required coverage.'
          }
          foreach ($case in $required.GetEnumerator()) {
            $matching = @($results | Where-Object testName -match "\.$($case.Key)(\(|$)")
            if ($matching.Count -ne $case.Value) { throw "Missing or duplicate cases for $($case.Key)." }
          }
        displayName: 'Require named cases and reject empty or skipped TRX runs'
      - pwsh: |
          $consumer = 'compatibility/FileConsumer/FileCompatibilityConsumer.csproj'
          $framework = if ($IsWindows) { 'net48' } else { 'net10.0' }
          dotnet build $consumer -c Release --framework $framework
          if ($LASTEXITCODE -ne 0) { throw 'Old consumer compilation failed.' }
          $output = "compatibility/FileConsumer/bin/Release/$framework"
          $binary = if ($IsWindows) { "$output/FileCompatibilityConsumer.exe" } else { "$output/FileCompatibilityConsumer.dll" }
          $before = (Get-FileHash $binary).Hash
          $originalBinary = Join-Path '$(Agent.TempDirectory)' ([IO.Path]::GetFileName($binary))
          Copy-Item $binary $originalBinary -Force
          if ($IsWindows) { & $binary } else { dotnet $binary }
          if ($LASTEXITCODE -ne 0) { throw 'Released-package consumer execution failed.' }

          dotnet pack src/File/Akka.Streams.File/Akka.Streams.File.csproj -c Release -p:PackageVersion=1.5.59-file-validation -o FilePackages
          if ($LASTEXITCODE -ne 0) { throw 'Package creation or API/TFM validation failed.' }
          $feed = (Resolve-Path FilePackages).Path
          $candidateCache = Join-Path '$(Agent.TempDirectory)' ("file-consumer-{0}-{1}-packages" -f $framework, [guid]::NewGuid().ToString('N'))
          # Resolve dependencies and binding configuration for the consumer's own TFM.
          dotnet build $consumer -c Release --framework $framework --force --no-incremental -p:FileConsumerPackageVersion=1.5.59-file-validation "-p:RestoreAdditionalProjectSources=$feed" "-p:RestorePackagesPath=$candidateCache"
          if ($LASTEXITCODE -ne 0) { throw 'Consumer source is incompatible with the candidate package.' }
          $resolvedPackage = Join-Path $candidateCache 'akka.streams.file/1.5.59-file-validation/akka.streams.file.1.5.59-file-validation.nupkg'
          $builtPackage = Join-Path $feed 'Akka.Streams.File.1.5.59-file-validation.nupkg'
          if ((Get-FileHash $resolvedPackage).Hash -ne (Get-FileHash $builtPackage).Hash) { throw 'Consumer resolved a different candidate package.' }
          $libraryFramework = if ($IsWindows) { 'netstandard2.0' } else { 'net6.0' }
          $candidate = "src/File/Akka.Streams.File/bin/Release/$libraryFramework"
          Copy-Item $originalBinary $binary -Force
          if ((Get-FileHash $binary).Hash -ne $before) { throw 'Consumer was changed after compilation.' }
          if ((Get-FileHash "$output/Akka.Streams.File.dll").Hash -ne (Get-FileHash "$candidate/Akka.Streams.File.dll").Hash) {
            throw 'Consumer did not receive the candidate library.'
          }
          if ($IsWindows) { & $binary } else { dotnet $binary }
          if ($LASTEXITCODE -ne 0) { throw 'Previously compiled consumer failed with the candidate.' }
        displayName: 'Validate API/TFMs and run unchanged released-package consumer with candidate'
      - pwsh: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packages = @(Get-ChildItem FilePackages/*.nupkg)
          if ($packages.Count -ne 1) { throw 'Expected exactly one File package.' }
          $package = $packages[0]
          $archive = [IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $nuspecEntry = @($archive.Entries | Where-Object FullName -like '*.nuspec')
            if ($nuspecEntry.Count -ne 1) { throw 'Expected exactly one package manifest.' }
            $reader = [IO.StreamReader]::new($nuspecEntry[0].Open())
            try { [xml]$nuspec = $reader.ReadToEnd() } finally { $reader.Dispose() }
            if ($nuspec.package.metadata.id -ne 'Akka.Streams.File') { throw 'Unexpected package identity.' }
            $version = $nuspec.package.metadata.version
            $readmePath = [string]$nuspec.package.metadata.readme
            if (!$readmePath) { throw 'NuGet manifest does not declare a README.' }
            $entry = $archive.GetEntry($readmePath)
            if (!$entry) { throw 'README is absent from NuGet archive.' }
            $reader = [IO.StreamReader]::new($entry.Open())
            try { $readme = $reader.ReadToEnd() } finally { $reader.Dispose() }
            $sourceReadme = Get-Content src/File/Akka.Streams.File/README.md -Raw
            if ($readme -cne $sourceReadme) { throw 'Packaged README differs from the source.' }
            foreach ($tfm in @('net6.0', 'netstandard2.0')) {
              if (!$archive.GetEntry("lib/$tfm/Akka.Streams.File.dll")) { throw "Missing retained TFM $tfm." }
            }
          } finally { $archive.Dispose() }

          $examples = [regex]::Matches($readme, '(?s)```csharp\r?\n(.*?)```')
          if ($examples.Count -ne 2) { throw 'Expected two complete README examples.' }
          $feed = [Security.SecurityElement]::Escape((Resolve-Path FilePackages).Path)
          $cache = [Security.SecurityElement]::Escape((Join-Path '$(Agent.TempDirectory)' ("file-readme-{0}-packages" -f [guid]::NewGuid().ToString('N'))))
          for ($i = 0; $i -lt $examples.Count; $i++) {
            $directory = Join-Path '$(Agent.TempDirectory)' "file-readme-$i"
            New-Item $directory -ItemType Directory -Force | Out-Null
            Set-Content "$directory/Program.cs" $examples[$i].Groups[1].Value
            Set-Content "$directory/Example.csproj" "<Project Sdk='Microsoft.NET.Sdk'><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable><RestoreSources>$feed;https://api.nuget.org/v3/index.json</RestoreSources><RestorePackagesPath>$cache</RestorePackagesPath></PropertyGroup><ItemGroup><PackageReference Include='Akka.Streams.File' Version='$version' /></ItemGroup></Project>"
            dotnet build "$directory/Example.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { throw "README example $i did not compile." }
          }
        displayName: 'Inspect NuGet README/TFMs and compile the shipped examples'
      - task: PublishTestResults@2
        condition: always()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: FileResults/*.trx
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: true
