# Pull request validation for Windows against the `dev` and `master` branches
# See https://docs.microsoft.com/en-us/azure/devops/pipelines/yaml-schema for reference
trigger:
  branches:
    include:
      - dev
      - v1.*
      - master
      - feature/*

pr:
  autoCancel: true # indicates whether additional pushes to a PR should cancel in-progress runs for the same PR. Defaults to true
  branches:
    include: [ dev, v1.*, master, feature/* ] # branch names which will trigger a build

name: $(Year:yyyy).$(Month).$(DayOfMonth)$(Rev:.r)

jobs:
  - template: azure-pipeline.template.yaml
    parameters:
      name: 'net_tests_linux'
      displayName: '.NET Unit Tests (Linux)'
      vmImage: 'ubuntu-latest'
      scriptFileName: './build.sh'
      scriptArgs: runTestsNet
      outputDirectory: 'TestResults'
      artifactName: 'net_tests_linux-$(Build.BuildId)'
      amqpTestUseDocker: true # Flag for AQMP test to use RabbitMQ docker
  - job: sns_validation
    displayName: 'SNS integration and compatibility'
    timeoutInMinutes: 30
    strategy:
      matrix:
        linux:
          image: ubuntu-latest
          snsFramework: net10.0
          snsFilter: FullyQualifiedName~Akka.Streams.Sns.Tests
        windows:
          image: windows-latest
          snsFramework: net48
          snsFilter: FullyQualifiedName~Akka.Streams.Sns.Tests
    pool:
      vmImage: $(image)
    steps:
      - checkout: self
      - task: UseDotNet@2
        inputs:
          packageType: sdk
          useGlobalJson: true
      - pwsh: |
          dotnet test src/AWS/SNS/Akka.Streams.Sns.Tests/Akka.Streams.Sns.Tests.csproj -c Release --framework "$(snsFramework)" --filter "$(snsFilter)" --logger "trx;LogFileName=sns.trx" --results-directory SnsResults
          if ($LASTEXITCODE -ne 0) { throw 'SNS tests failed.' }
        displayName: 'Run SNS required tests'
      - pwsh: |
          dotnet test src/AWS/SNS/Akka.Streams.Sns.IntegrationTests/Akka.Streams.Sns.IntegrationTests.csproj -c Release --logger "trx;LogFileName=sns-integration.trx" --results-directory SnsIntegrationResults
          if ($LASTEXITCODE -ne 0) { throw 'SNS native integration tests failed.' }
          $observer = Get-Content src/AWS/SNS/Akka.Streams.Sns.IntegrationTests/obj/project.assets.json -Raw | ConvertFrom-Json
          $names = @($observer.libraries.PSObject.Properties.Name)
          if (@($names | Where-Object { $_ -match '^AWSSDK\.SQS/4\.' }).Count -ne 1 -or @($names | Where-Object { $_ -match '^AWSSDK\.Core/4\.' }).Count -ne 1 -or @($names | Where-Object { $_ -match '^Akka\.Streams\.SQS/' -or $_ -match '^AWSSDK\.(SQS|Core)/3\.' }).Count -gt 0) { throw 'SNS observer must use a separate SDK4 graph.' }
          dotnet restore src/AWS/SQS/Akka.Streams.SQS/Akka.Streams.SQS.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Legacy SQS dependency restore failed.' }
          $legacy = Get-Content src/AWS/SQS/Akka.Streams.SQS/obj/project.assets.json -Raw | ConvertFrom-Json
          if (@($legacy.libraries.PSObject.Properties.Name | Where-Object { $_ -match '^AWSSDK\.SQS/3\.' }).Count -ne 1) { throw 'The shipped SQS adapter must retain its SDK3 dependency.' }
        displayName: 'Run native SNS subscriptions and verify SDK isolation'
        condition: eq(variables['Agent.OS'], 'Linux')
      - pwsh: |
          [xml]$trx = Get-Content SnsResults/sns.trx -Raw
          $results = @($trx.TestRun.Results.UnitTestResult)
          $required = @{
            ItShouldPublishASingleMessageToSns = 1
            ItShouldPublishMultipleMessagesToSns = 1
            ItShouldFailTheStageIfTheAmazonSnsAsyncClientRequestFails = 1
            ItShouldFailTheStageIfAnUpstreamFailureOccurs = 1
            The_final_response_completes_without_extra_downstream_demand = 1
            A_canceled_sdk_publish_fails_with_a_cancellation_error = 1
          }
          if ($results.Count -eq 0 -or @($results | Where-Object outcome -ne Passed).Count -gt 0) {
            throw 'Every discovered test must execute and pass; empty or skipped runs are invalid.'
          }
          if (@($results.testName | Select-Object -Unique).Count -ne $results.Count) {
            throw 'Duplicate test cases cannot replace required coverage.'
          }
          foreach ($case in $required.GetEnumerator()) {
            $matching = @($results | Where-Object testName -match "\.$($case.Key)(\(|$)")
            if ($matching.Count -ne $case.Value) { throw "Missing or duplicate cases for $($case.Key)." }
          }
        displayName: 'Require named cases and reject empty or skipped TRX runs'
      - pwsh: |
          [xml]$trx = Get-Content SnsIntegrationResults/sns-integration.trx -Raw
          $results = @($trx.TestRun.Results.UnitTestResult)
          $required = @{
            Plain_flow_delivers_exact_payloads_to_native_subscribers_and_keeps_the_borrowed_client_open = 2
            Plain_sink_awaits_publication_and_preserves_the_borrowed_client = 1
            Missing_topic_fails_with_the_sdk_error_and_preserves_the_borrowed_client = 1
          }
          if ($results.Count -eq 0 -or @($results | Where-Object outcome -ne Passed).Count -gt 0) {
            throw 'Every discovered test must execute and pass; empty or skipped runs are invalid.'
          }
          if (@($results.testName | Select-Object -Unique).Count -ne $results.Count) {
            throw 'Duplicate test cases cannot replace required coverage.'
          }
          foreach ($case in $required.GetEnumerator()) {
            $matching = @($results | Where-Object testName -match "\.$($case.Key)(\(|$)")
            if ($matching.Count -ne $case.Value) { throw "Missing or duplicate cases for $($case.Key)." }
          }
        displayName: 'Require native SNS cases with zero skips'
        condition: eq(variables['Agent.OS'], 'Linux')
      - pwsh: |
          $consumer = 'compatibility/SnsConsumer/SnsCompatibilityConsumer.csproj'
          $framework = if ($IsWindows) { 'net48' } else { 'net10.0' }
          dotnet build $consumer -c Release --framework $framework
          if ($LASTEXITCODE -ne 0) { throw 'Old consumer compilation failed.' }
          $output = "compatibility/SnsConsumer/bin/Release/$framework"
          $binary = if ($IsWindows) { "$output/SnsCompatibilityConsumer.exe" } else { "$output/SnsCompatibilityConsumer.dll" }
          $before = (Get-FileHash $binary).Hash
          $originalBinary = Join-Path '$(Agent.TempDirectory)' ([IO.Path]::GetFileName($binary))
          Copy-Item $binary $originalBinary -Force
          if ($IsWindows) { & $binary } else { dotnet $binary }
          if ($LASTEXITCODE -ne 0) { throw 'Released-package consumer execution failed.' }

          dotnet pack src/AWS/SNS/Akka.Streams.Sns/Akka.Streams.Sns.csproj -c Release -p:PackageVersion=1.5.59-sns-validation -o SnsPackages
          if ($LASTEXITCODE -ne 0) { throw 'Package creation or API/TFM validation failed.' }
          $feed = (Resolve-Path SnsPackages).Path
          $candidateCache = Join-Path '$(Agent.TempDirectory)' ("sns-consumer-{0}-{1}-packages" -f $framework, [guid]::NewGuid().ToString('N'))
          # Resolve dependencies and binding configuration for the consumer's own TFM.
          dotnet build $consumer -c Release --framework $framework --force --no-incremental -p:SnsConsumerPackageVersion=1.5.59-sns-validation "-p:RestoreAdditionalProjectSources=$feed" "-p:RestorePackagesPath=$candidateCache"
          if ($LASTEXITCODE -ne 0) { throw 'Consumer source is incompatible with the candidate package.' }
          $resolvedPackage = Join-Path $candidateCache 'akka.streams.sns/1.5.59-sns-validation/akka.streams.sns.1.5.59-sns-validation.nupkg'
          $builtPackage = Join-Path $feed 'Akka.Streams.Sns.1.5.59-sns-validation.nupkg'
          if ((Get-FileHash $resolvedPackage).Hash -ne (Get-FileHash $builtPackage).Hash) { throw 'Consumer resolved a different candidate package.' }
          $libraryFramework = if ($IsWindows) { 'netstandard2.0' } else { 'net6.0' }
          $candidate = "src/AWS/SNS/Akka.Streams.Sns/bin/Release/$libraryFramework"
          Copy-Item $originalBinary $binary -Force
          if ((Get-FileHash $binary).Hash -ne $before) { throw 'Consumer was changed after compilation.' }
          if ((Get-FileHash "$output/Akka.Streams.Sns.dll").Hash -ne (Get-FileHash "$candidate/Akka.Streams.Sns.dll").Hash) {
            throw 'Consumer did not receive the candidate library.'
          }
          if ($IsWindows) { & $binary } else { dotnet $binary }
          if ($LASTEXITCODE -ne 0) { throw 'Previously compiled consumer failed with the candidate.' }
        displayName: 'Validate API/TFMs and run unchanged released-package consumer with candidate'
      - pwsh: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packages = @(Get-ChildItem SnsPackages/*.nupkg)
          if ($packages.Count -ne 1) { throw 'Expected exactly one SNS package.' }
          $package = $packages[0]
          $archive = [IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $nuspecEntry = @($archive.Entries | Where-Object FullName -like '*.nuspec')
            if ($nuspecEntry.Count -ne 1) { throw 'Expected exactly one package manifest.' }
            $reader = [IO.StreamReader]::new($nuspecEntry[0].Open())
            try { [xml]$nuspec = $reader.ReadToEnd() } finally { $reader.Dispose() }
            if ($nuspec.package.metadata.id -ne 'Akka.Streams.Sns') { throw 'Unexpected package identity.' }
            $version = $nuspec.package.metadata.version
            $readmePath = [string]$nuspec.package.metadata.readme
            if (!$readmePath) { throw 'NuGet manifest does not declare a README.' }
            $entry = $archive.GetEntry($readmePath)
            if (!$entry) { throw 'README is absent from NuGet archive.' }
            $reader = [IO.StreamReader]::new($entry.Open())
            try { $readme = $reader.ReadToEnd() } finally { $reader.Dispose() }
            $sourceReadme = Get-Content src/AWS/SNS/Akka.Streams.Sns/README.md -Raw
            if ($readme -cne $sourceReadme) { throw 'Packaged README differs from the source.' }
            foreach ($tfm in @('net6.0', 'netstandard2.0')) {
              if (!$archive.GetEntry("lib/$tfm/Akka.Streams.Sns.dll")) { throw "Missing retained TFM $tfm." }
            }
          } finally { $archive.Dispose() }

          $examples = [regex]::Matches($readme, '(?s)```csharp\r?\n(.*?)```')
          if ($examples.Count -ne 2) { throw 'Expected two complete README examples.' }
          $feed = [Security.SecurityElement]::Escape((Resolve-Path SnsPackages).Path)
          $cache = [Security.SecurityElement]::Escape((Join-Path '$(Agent.TempDirectory)' ("sns-readme-{0}-packages" -f [guid]::NewGuid().ToString('N'))))
          for ($i = 0; $i -lt $examples.Count; $i++) {
            $directory = Join-Path '$(Agent.TempDirectory)' "sns-readme-$i"
            New-Item $directory -ItemType Directory -Force | Out-Null
            Set-Content "$directory/Program.cs" $examples[$i].Groups[1].Value
            Set-Content "$directory/Example.csproj" "<Project Sdk='Microsoft.NET.Sdk'><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable><RestoreSources>$feed;https://api.nuget.org/v3/index.json</RestoreSources><RestorePackagesPath>$cache</RestorePackagesPath></PropertyGroup><ItemGroup><PackageReference Include='Akka.Streams.Sns' Version='$version' /></ItemGroup></Project>"
            dotnet build "$directory/Example.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { throw "README example $i did not compile." }
          }
        displayName: 'Inspect NuGet README/TFMs and compile the shipped examples'
      - task: PublishTestResults@2
        condition: always()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: |
            SnsResults/*.trx
            SnsIntegrationResults/*.trx
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: true
