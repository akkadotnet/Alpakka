          $resolvedPackage = Join-Path $candidateCache 'akka.streams.csv/1.5.59-csv-validation/akka.streams.csv.1.5.59-csv-validation.nupkg'
          $builtPackage = Join-Path $feed 'Akka.Streams.Csv.1.5.59-csv-validation.nupkg'
          if ((Get-FileHash $resolvedPackage).Hash -ne (Get-FileHash $builtPackage).Hash) { throw 'Consumer resolved a different candidate package.' }
          $libraryFramework = if ($IsWindows) { 'netstandard2.0' } else { 'net6.0' }
          $candidate = "src/Csv/Akka.Streams.Csv/bin/Release/$libraryFramework"
          Copy-Item $originalBinary $binary -Force
          if ((Get-FileHash $binary).Hash -ne $before) { throw 'Consumer was changed after compilation.' }
          if ((Get-FileHash "$output/Akka.Streams.Csv.dll").Hash -ne (Get-FileHash "$candidate/Akka.Streams.Csv.dll").Hash) {
            throw 'Consumer did not receive the candidate library.'
          }
          if ($IsWindows) { & $binary } else { dotnet $binary }
          if ($LASTEXITCODE -ne 0) { throw 'Previously compiled consumer failed with the candidate.' }
