# Pull request validation for Windows against the `dev` and `master` branches
# See https://docs.microsoft.com/en-us/azure/devops/pipelines/yaml-schema for reference
trigger:
  branches:
    include:
      - dev
      - v1.*
      - master
      - feature/*

pr:
  autoCancel: true # indicates whether additional pushes to a PR should cancel in-progress runs for the same PR. Defaults to true
  branches:
    include: [ dev, v1.*, master, feature/* ] # branch names which will trigger a build

name: $(Year:yyyy).$(Month).$(DayOfMonth)$(Rev:.r)

jobs:
  - template: azure-pipeline.template.yaml
    parameters:
      name: 'net_tests_linux'
      displayName: '.NET Unit Tests (Linux)'
      vmImage: 'ubuntu-latest'
      scriptFileName: './build.sh'
      scriptArgs: runTestsNet
      outputDirectory: 'TestResults'
      artifactName: 'net_tests_linux-$(Build.BuildId)'
      amqpTestUseDocker: true # Flag for AQMP test to use RabbitMQ docker
  - job: kinesis_validation
    displayName: 'Kinesis integration and compatibility'
    timeoutInMinutes: 30
    strategy:
      matrix:
        linux:
          image: ubuntu-latest
          kinesisFramework: net10.0
          kinesisFilter: FullyQualifiedName~Akka.Streams.Kinesis.Tests
        windows:
          image: windows-latest
          kinesisFramework: net48
          kinesisFilter: FullyQualifiedName!~KinesisIntegrationSpec
    pool:
      vmImage: $(image)
    steps:
      - checkout: self
      - task: UseDotNet@2
        inputs:
          packageType: sdk
          useGlobalJson: true
      - pwsh: |
          dotnet test src/AWS/Kinesis/Akka.Streams.Kinesis.Tests/Akka.Streams.Kinesis.Tests.csproj -c Release --framework "$(kinesisFramework)" --filter "$(kinesisFilter)" --logger "trx;LogFileName=kinesis.trx" --results-directory KinesisResults
          if ($LASTEXITCODE -ne 0) { throw 'Kinesis tests failed.' }
        displayName: 'Run Kinesis required tests'
      - pwsh: |
          [xml]$trx = Get-Content KinesisResults/kinesis.trx -Raw
          $results = @($trx.TestRun.Results.UnitTestResult)
          $required = @{
            KinesisFlow_must_publish_records = 1
            KinesisFlow_must_publish_records_with_retries = 1
            KinesisFlow_must_fail_after_trying_to_publish_records_with_several_retries = 1
            KinesisFlow_must_fail_when_request_returns_an_error = 1
            A_terminal_shard_response_drains_every_record_before_completion = 1
            A_finite_publish_completes_after_its_last_pending_sdk_result = 1
            Concurrent_failed_batches_retry_every_record = 1
            KinesisSource_must_poll_for_records = 1
            KinesisSource_must_poll_for_records_with_multiple_requests = 1
            KinesisSource_must_poll_for_batched_records_with_multiple_requests = 1
            KinesisSource_must_wait_for_request_before_passing_downstream = 1
            KinesisSource_must_complete_stage_when_shard_iterator_is_null = 1
            KinesisSource_must_fail_when_kinesis_client_fails = 1
            The_source_disposes_its_owned_client_once_on_every_termination = 3
          }
          if (!$IsWindows) {
            $required['Publishing_modes_match_native_payloads_and_sequence_numbers_and_dispose_their_client'] = 3
            $required['Source_reads_native_records_from_the_requested_position_and_disposes_its_client'] = 3
            $required['A_missing_stream_fails_and_disposes_the_owned_client'] = 2
            $required['The_sink_publishes_native_records_and_disposes_its_client_after_completion'] = 1
          }
          if ($results.Count -eq 0 -or @($results | Where-Object outcome -ne Passed).Count -gt 0) {
            throw 'Every discovered test must execute and pass; empty or skipped runs are invalid.'
          }
          if (@($results.testName | Select-Object -Unique).Count -ne $results.Count) {
            throw 'Duplicate test cases cannot replace required coverage.'
          }
          foreach ($case in $required.GetEnumerator()) {
            $matching = @($results | Where-Object testName -match "\.$($case.Key)(\(|$)")
            if ($matching.Count -ne $case.Value) { throw "Missing or duplicate cases for $($case.Key)." }
          }
        displayName: 'Require named cases and reject empty or skipped TRX runs'
      - pwsh: |
          $consumer = 'compatibility/KinesisConsumer/KinesisCompatibilityConsumer.csproj'
          $framework = if ($IsWindows) { 'net48' } else { 'net10.0' }
          dotnet build $consumer -c Release --framework $framework
          if ($LASTEXITCODE -ne 0) { throw 'Old consumer compilation failed.' }
          $output = "compatibility/KinesisConsumer/bin/Release/$framework"
          $binary = if ($IsWindows) { "$output/KinesisCompatibilityConsumer.exe" } else { "$output/KinesisCompatibilityConsumer.dll" }
          $before = (Get-FileHash $binary).Hash
          $originalBinary = Join-Path '$(Agent.TempDirectory)' ([IO.Path]::GetFileName($binary))
          Copy-Item $binary $originalBinary -Force
          if ($IsWindows) { & $binary } else { dotnet $binary }
          if ($LASTEXITCODE -ne 0) { throw 'Released-package consumer execution failed.' }

          dotnet pack src/AWS/Kinesis/Akka.Streams.Kinesis/Akka.Streams.Kinesis.csproj -c Release -p:PackageVersion=1.5.59-kinesis-validation -o KinesisPackages
          if ($LASTEXITCODE -ne 0) { throw 'Package creation or API/TFM validation failed.' }
          $feed = (Resolve-Path KinesisPackages).Path
          $candidateCache = Join-Path '$(Agent.TempDirectory)' ("kinesis-consumer-{0}-{1}-packages" -f $framework, [guid]::NewGuid().ToString('N'))
          # Resolve dependencies and binding configuration for the consumer's own TFM.
          dotnet build $consumer -c Release --framework $framework --force --no-incremental -p:KinesisConsumerPackageVersion=1.5.59-kinesis-validation "-p:RestoreAdditionalProjectSources=$feed" "-p:RestorePackagesPath=$candidateCache"
          if ($LASTEXITCODE -ne 0) { throw 'Consumer source is incompatible with the candidate package.' }
          $resolvedPackage = Join-Path $candidateCache 'akka.streams.kinesis/1.5.59-kinesis-validation/akka.streams.kinesis.1.5.59-kinesis-validation.nupkg'
          $builtPackage = Join-Path $feed 'Akka.Streams.Kinesis.1.5.59-kinesis-validation.nupkg'
          if ((Get-FileHash $resolvedPackage).Hash -ne (Get-FileHash $builtPackage).Hash) { throw 'Consumer resolved a different candidate package.' }
          $libraryFramework = if ($IsWindows) { 'netstandard2.0' } else { 'net6.0' }
          $candidate = "src/AWS/Kinesis/Akka.Streams.Kinesis/bin/Release/$libraryFramework"
          Copy-Item $originalBinary $binary -Force
          if ((Get-FileHash $binary).Hash -ne $before) { throw 'Consumer was changed after compilation.' }
          if ((Get-FileHash "$output/Akka.Streams.Kinesis.dll").Hash -ne (Get-FileHash "$candidate/Akka.Streams.Kinesis.dll").Hash) {
            throw 'Consumer did not receive the candidate library.'
          }
          if ($IsWindows) { & $binary } else { dotnet $binary }
          if ($LASTEXITCODE -ne 0) { throw 'Previously compiled consumer failed with the candidate.' }
        displayName: 'Validate API/TFMs and run unchanged released-package consumer with candidate'
      - pwsh: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packages = @(Get-ChildItem KinesisPackages/*.nupkg)
          if ($packages.Count -ne 1) { throw 'Expected exactly one Kinesis package.' }
          $package = $packages[0]
          $archive = [IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $nuspecEntry = @($archive.Entries | Where-Object FullName -like '*.nuspec')
            if ($nuspecEntry.Count -ne 1) { throw 'Expected exactly one package manifest.' }
            $reader = [IO.StreamReader]::new($nuspecEntry[0].Open())
            try { [xml]$nuspec = $reader.ReadToEnd() } finally { $reader.Dispose() }
            if ($nuspec.package.metadata.id -ne 'Akka.Streams.Kinesis') { throw 'Unexpected package identity.' }
            $version = $nuspec.package.metadata.version
            $readmePath = [string]$nuspec.package.metadata.readme
            if (!$readmePath) { throw 'NuGet manifest does not declare a README.' }
            $entry = $archive.GetEntry($readmePath)
            if (!$entry) { throw 'README is absent from NuGet archive.' }
            $reader = [IO.StreamReader]::new($entry.Open())
            try { $readme = $reader.ReadToEnd() } finally { $reader.Dispose() }
            $sourceReadme = Get-Content src/AWS/Kinesis/Akka.Streams.Kinesis/README.md -Raw
            if ($readme -cne $sourceReadme) { throw 'Packaged README differs from the source.' }
            foreach ($tfm in @('net6.0', 'netstandard2.0')) {
              if (!$archive.GetEntry("lib/$tfm/Akka.Streams.Kinesis.dll")) { throw "Missing retained TFM $tfm." }
            }
          } finally { $archive.Dispose() }

          $examples = [regex]::Matches($readme, '(?s)```csharp\r?\n(.*?)```')
          if ($examples.Count -ne 2) { throw 'Expected two complete README examples.' }
          $feed = [Security.SecurityElement]::Escape((Resolve-Path KinesisPackages).Path)
          $cache = [Security.SecurityElement]::Escape((Join-Path '$(Agent.TempDirectory)' ("kinesis-readme-{0}-packages" -f [guid]::NewGuid().ToString('N'))))
          for ($i = 0; $i -lt $examples.Count; $i++) {
            $directory = Join-Path '$(Agent.TempDirectory)' "kinesis-readme-$i"
            New-Item $directory -ItemType Directory -Force | Out-Null
            Set-Content "$directory/Program.cs" $examples[$i].Groups[1].Value
            Set-Content "$directory/Example.csproj" "<Project Sdk='Microsoft.NET.Sdk'><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable><RestoreSources>$feed;https://api.nuget.org/v3/index.json</RestoreSources><RestorePackagesPath>$cache</RestorePackagesPath></PropertyGroup><ItemGroup><PackageReference Include='Akka.Streams.Kinesis' Version='$version' /></ItemGroup></Project>"
            dotnet build "$directory/Example.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { throw "README example $i did not compile." }
          }
        displayName: 'Inspect NuGet README/TFMs and compile the shipped examples'
      - task: PublishTestResults@2
        condition: always()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: KinesisResults/*.trx
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: true
