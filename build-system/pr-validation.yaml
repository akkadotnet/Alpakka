# Pull request validation for Windows against the `dev` and `master` branches
# See https://docs.microsoft.com/en-us/azure/devops/pipelines/yaml-schema for reference
trigger:
  branches:
    include:
      - dev
      - v1.*
      - master
      - feature/*

pr:
  autoCancel: true # indicates whether additional pushes to a PR should cancel in-progress runs for the same PR. Defaults to true
  branches:
    include: [ dev, v1.*, master, feature/* ] # branch names which will trigger a build

name: $(Year:yyyy).$(Month).$(DayOfMonth)$(Rev:.r)

jobs:
  - template: azure-pipeline.template.yaml
    parameters:
      name: 'net_tests_linux'
      displayName: '.NET Unit Tests (Linux)'
      vmImage: 'ubuntu-latest'
      scriptFileName: './build.sh'
      scriptArgs: runTestsNet
      outputDirectory: 'TestResults'
      artifactName: 'net_tests_linux-$(Build.BuildId)'
      amqpTestUseDocker: true # Flag for AQMP test to use RabbitMQ docker
  - job: servicebus_validation
    displayName: 'Service Bus integration and compatibility'
    timeoutInMinutes: 30
    strategy:
      matrix:
        linux:
          image: ubuntu-latest
          testFilter: FullyQualifiedName~Akka.Streams.ServiceBus.Tests
          integration: true
        windows:
          image: windows-latest
          testFilter: FullyQualifiedName~ServiceBusSourceContractSpec
          integration: false
    pool:
      vmImage: $(image)
    steps:
      - checkout: self
      - task: UseDotNet@2
        inputs:
          packageType: sdk
          useGlobalJson: true
      - pwsh: |
          dotnet test src/Azure/Akka.Streams.Azure.ServiceBus.Tests/Akka.Streams.Azure.ServiceBus.Tests.csproj -c Release --filter "$(testFilter)" --logger "trx;LogFileName=servicebus.trx" --results-directory ServiceBusResults
          if ($LASTEXITCODE -ne 0) { throw 'Service Bus tests failed.' }
        displayName: 'Run Service Bus tests (emulator on Linux, contracts on Windows)'
      - pwsh: |
          [xml]$trx = Get-Content ServiceBusResults/servicebus.trx -Raw
          $results = @($trx.TestRun.Results.UnitTestResult)
          $required = @{
            Raw_source_only_receives_on_demand_and_leaves_settlement_to_the_caller = 1
            Canceling_during_settlement_stops_the_stage_without_disposing_the_receiver = 1
            Typed_source_observes_settlement_before_emitting = 3
            Typed_source_keeps_deserialization_errors_observable = 3
          }
          if ('$(integration)' -eq 'true') {
            $required.Queue_and_topic_roundtrips_preserve_payloads_and_settle_messages = 4
            $required.Peek_distinguishes_locked_messages_from_completed_messages = 2
            $required.A_QueueSource_should_push_available_messages = 1
            $required.A_QueueSource_should_poll_for_messages_if_the_queue_is_empty = 1
            $required.A_QueueSource_should_leave_the_next_message_visible_to_peek = 1
            $required.A_QueueSink_should_add_elements_to_the_queue = 1
            $required.A_QueueSink_should_set_the_exception_of_the_task_when_an_error_occurs = 1
          }
          if ($results.Count -eq 0 -or @($results | Where-Object outcome -ne Passed).Count -gt 0) {
            throw 'Every discovered test must execute and pass; empty or skipped runs are invalid.'
          }
          if (@($results.testName | Select-Object -Unique).Count -ne $results.Count) {
            throw 'Duplicate test cases cannot replace required coverage.'
          }
          foreach ($case in $required.GetEnumerator()) {
            $matching = @($results | Where-Object testName -match "\.$($case.Key)(\(|$)")
            if ($matching.Count -ne $case.Value) { throw "Missing or duplicate cases for $($case.Key)." }
          }
        displayName: 'Require named cases and reject empty or skipped TRX runs'
      - pwsh: |
          $consumer = 'compatibility/ServiceBusConsumer/ServiceBusCompatibilityConsumer.csproj'
          $framework = if ($IsWindows) { 'net48' } else { 'net10.0' }
          dotnet build $consumer -c Release --framework $framework
          if ($LASTEXITCODE -ne 0) { throw 'Old consumer compilation failed.' }
          $output = "compatibility/ServiceBusConsumer/bin/Release/$framework"
          $binary = if ($IsWindows) { "$output/ServiceBusCompatibilityConsumer.exe" } else { "$output/ServiceBusCompatibilityConsumer.dll" }
          $before = (Get-FileHash $binary).Hash
          $originalBinary = Join-Path '$(Agent.TempDirectory)' ([IO.Path]::GetFileName($binary))
          Copy-Item $binary $originalBinary -Force
          if ($IsWindows) { & $binary } else { dotnet $binary }
          if ($LASTEXITCODE -ne 0) { throw 'Released-package consumer execution failed.' }

          dotnet pack src/Azure/Akka.Streams.Azure.ServiceBus/Akka.Streams.Azure.ServiceBus.csproj -c Release -p:PackageVersion=1.5.59-servicebus-validation -o ServiceBusPackages
          if ($LASTEXITCODE -ne 0) { throw 'Package creation or API/TFM validation failed.' }
          $feed = (Resolve-Path ServiceBusPackages).Path
          $candidateCache = Join-Path '$(Agent.TempDirectory)' "servicebus-consumer-$framework-packages"
          # Resolve dependencies and binding configuration for the consumer's own TFM.
          dotnet build $consumer -c Release --framework $framework --force --no-incremental -p:ServiceBusConsumerPackageVersion=1.5.59-servicebus-validation "-p:RestoreAdditionalProjectSources=$feed" "-p:RestorePackagesPath=$candidateCache"
          if ($LASTEXITCODE -ne 0) { throw 'Consumer source is incompatible with the candidate package.' }
          $resolvedPackage = Join-Path $candidateCache 'akka.streams.azure.servicebus/1.5.59-servicebus-validation/akka.streams.azure.servicebus.1.5.59-servicebus-validation.nupkg'
          $builtPackage = Join-Path $feed 'Akka.Streams.Azure.ServiceBus.1.5.59-servicebus-validation.nupkg'
          if ((Get-FileHash $resolvedPackage).Hash -ne (Get-FileHash $builtPackage).Hash) { throw 'Consumer resolved a different candidate package.' }
          $libraryFramework = if ($IsWindows) { 'netstandard2.0' } else { 'net6.0' }
          $candidate = "src/Azure/Akka.Streams.Azure.ServiceBus/bin/Release/$libraryFramework"
          Copy-Item $originalBinary $binary -Force
          if ((Get-FileHash $binary).Hash -ne $before) { throw 'Consumer was changed after compilation.' }
          if ((Get-FileHash "$output/Akka.Streams.Azure.ServiceBus.dll").Hash -ne (Get-FileHash "$candidate/Akka.Streams.Azure.ServiceBus.dll").Hash) {
            throw 'Consumer did not receive the candidate library.'
          }
          if ($IsWindows) { & $binary } else { dotnet $binary }
          if ($LASTEXITCODE -ne 0) { throw 'Previously compiled consumer failed with the candidate.' }
        displayName: 'Validate API/TFMs and run unchanged released-package consumer with candidate'
      - pwsh: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packages = @(Get-ChildItem ServiceBusPackages/*.nupkg)
          if ($packages.Count -ne 1) { throw 'Expected exactly one Service Bus package.' }
          $package = $packages[0]
          $archive = [IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $nuspecEntry = @($archive.Entries | Where-Object FullName -like '*.nuspec')
            if ($nuspecEntry.Count -ne 1) { throw 'Expected exactly one package manifest.' }
            $reader = [IO.StreamReader]::new($nuspecEntry[0].Open())
            try { [xml]$nuspec = $reader.ReadToEnd() } finally { $reader.Dispose() }
            if ($nuspec.package.metadata.id -ne 'Akka.Streams.Azure.ServiceBus') { throw 'Unexpected package identity.' }
            $version = $nuspec.package.metadata.version
            $readmePath = [string]$nuspec.package.metadata.readme
            if (!$readmePath) { throw 'NuGet manifest does not declare a README.' }
            $entry = $archive.GetEntry($readmePath)
            if (!$entry) { throw 'README is absent from NuGet archive.' }
            $reader = [IO.StreamReader]::new($entry.Open())
            try { $readme = $reader.ReadToEnd() } finally { $reader.Dispose() }
            $sourceReadme = Get-Content src/Azure/Akka.Streams.Azure.ServiceBus/README.md -Raw
            if ($readme -cne $sourceReadme) { throw 'Packaged README differs from the source.' }
            foreach ($tfm in @('net6.0', 'netstandard2.0')) {
              if (!$archive.GetEntry("lib/$tfm/Akka.Streams.Azure.ServiceBus.dll")) { throw "Missing retained TFM $tfm." }
            }
          } finally { $archive.Dispose() }

          $examples = [regex]::Matches($readme, '(?s)```csharp\r?\n(.*?)```')
          if ($examples.Count -ne 2) { throw 'Expected two complete README examples.' }
          $feed = [Security.SecurityElement]::Escape((Resolve-Path ServiceBusPackages).Path)
          $cache = [Security.SecurityElement]::Escape((Join-Path '$(Agent.TempDirectory)' 'servicebus-readme-packages'))
          for ($i = 0; $i -lt $examples.Count; $i++) {
            $directory = Join-Path '$(Agent.TempDirectory)' "servicebus-readme-$i"
            New-Item $directory -ItemType Directory -Force | Out-Null
            Set-Content "$directory/Program.cs" $examples[$i].Groups[1].Value
            Set-Content "$directory/Example.csproj" "<Project Sdk='Microsoft.NET.Sdk'><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><RestoreSources>$feed;https://api.nuget.org/v3/index.json</RestoreSources><RestorePackagesPath>$cache</RestorePackagesPath></PropertyGroup><ItemGroup><PackageReference Include='Akka.Streams.Azure.ServiceBus' Version='$version' /></ItemGroup></Project>"
            dotnet build "$directory/Example.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { throw "README example $i did not compile." }
          }
        displayName: 'Inspect NuGet README/TFMs and compile the shipped examples'
      - task: PublishTestResults@2
        condition: always()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: ServiceBusResults/*.trx
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: true
