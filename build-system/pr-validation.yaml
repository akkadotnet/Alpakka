# Pull request validation for Windows against the `dev` and `master` branches
# See https://docs.microsoft.com/en-us/azure/devops/pipelines/yaml-schema for reference
trigger:
  branches:
    include:
      - dev
      - v1.*
      - master
      - feature/*

pr:
  autoCancel: true # indicates whether additional pushes to a PR should cancel in-progress runs for the same PR. Defaults to true
  branches:
    include: [ dev, v1.*, master, feature/* ] # branch names which will trigger a build

name: $(Year:yyyy).$(Month).$(DayOfMonth)$(Rev:.r)

jobs:
  - template: azure-pipeline.template.yaml
    parameters:
      name: 'net_tests_linux'
      displayName: '.NET Unit Tests (Linux)'
      vmImage: 'ubuntu-latest'
      scriptFileName: './build.sh'
      scriptArgs: runTestsNet
      outputDirectory: 'TestResults'
      artifactName: 'net_tests_linux-$(Build.BuildId)'
      amqpTestUseDocker: true # Flag for AQMP test to use RabbitMQ docker
  - job: eventhub_validation
    displayName: 'Event Hubs integration and compatibility'
    timeoutInMinutes: 30
    strategy:
      matrix:
        linux:
          image: ubuntu-latest
          eventHubFilter: FullyQualifiedName~Akka.Streams.Azure.EventHub.Tests
        windows:
          image: windows-latest
          eventHubFilter: FullyQualifiedName~EventHubSourceContractSpec
    pool:
      vmImage: $(image)
    steps:
      - checkout: self
      - task: UseDotNet@2
        inputs:
          packageType: sdk
          useGlobalJson: true
      - pwsh: |
          dotnet test src/Azure/Akka.Streams.Azure.EventHub.Tests/Akka.Streams.Azure.EventHub.Tests.csproj -c Release --framework net10.0 --filter "$(eventHubFilter)" --logger "trx;LogFileName=eventhub.trx" --results-directory EventHubResults
          if ($LASTEXITCODE -ne 0) { throw 'Event Hubs tests failed.' }
        displayName: 'Run Event Hubs required tests'
      - pwsh: |
          [xml]$trx = Get-Content EventHubResults/eventhub.trx -Raw
          $results = @($trx.TestRun.Results.UnitTestResult)
          $required = @{
            Batched_callback_waits_for_downstream_demand = 1
            Cancellation_releases_pending_callbacks_and_stops_the_processor = 2
            Partition_close_and_processing_failure_release_callbacks_and_stop_once = 4
            Partition_cancellation_releases_the_callback_without_emitting_its_event = 2
            Startup_failure_keeps_the_original_error_and_stops_the_processor = 2
            Batch_checkpoint_uses_the_highest_offset_and_its_sequence_number = 1
          }
          if (!$IsWindows) {
            $required['Sink_sends_exact_payloads_and_preserves_the_borrowed_producer'] = 1
            $required['Source_checkpoints_to_blob_and_recreated_processor_resumes_after_it'] = 2
          }
          if ($results.Count -eq 0 -or @($results | Where-Object outcome -ne Passed).Count -gt 0) {
            throw 'Every discovered test must execute and pass; empty or skipped runs are invalid.'
          }
          if (@($results.testName | Select-Object -Unique).Count -ne $results.Count) {
            throw 'Duplicate test cases cannot replace required coverage.'
          }
          foreach ($case in $required.GetEnumerator()) {
            $matching = @($results | Where-Object testName -match "\.$($case.Key)(\(|$)")
            if ($matching.Count -ne $case.Value) { throw "Missing or duplicate cases for $($case.Key)." }
          }
        displayName: 'Require named cases and reject empty or skipped TRX runs'
      - pwsh: |
          $consumer = 'compatibility/EventHubConsumer/EventHubCompatibilityConsumer.csproj'
          $framework = if ($IsWindows) { 'net48' } else { 'net10.0' }
          dotnet build $consumer -c Release --framework $framework
          if ($LASTEXITCODE -ne 0) { throw 'Old consumer compilation failed.' }
          $output = "compatibility/EventHubConsumer/bin/Release/$framework"
          $binary = if ($IsWindows) { "$output/EventHubCompatibilityConsumer.exe" } else { "$output/EventHubCompatibilityConsumer.dll" }
          $before = (Get-FileHash $binary).Hash
          $originalBinary = Join-Path '$(Agent.TempDirectory)' ([IO.Path]::GetFileName($binary))
          Copy-Item $binary $originalBinary -Force
          if ($IsWindows) { & $binary } else { dotnet $binary }
          if ($LASTEXITCODE -ne 0) { throw 'Released-package consumer execution failed.' }

          dotnet pack src/Azure/Akka.Streams.Azure.EventHub/Akka.Streams.Azure.EventHub.csproj -c Release -p:PackageVersion=1.5.59-eventhub-validation -o EventHubPackages
          if ($LASTEXITCODE -ne 0) { throw 'Package creation or API/TFM validation failed.' }
          $feed = (Resolve-Path EventHubPackages).Path
          $candidateCache = Join-Path '$(Agent.TempDirectory)' ("eventhub-consumer-{0}-{1}-packages" -f $framework, [guid]::NewGuid().ToString('N'))
          # Resolve dependencies and binding configuration for the consumer's own TFM.
          dotnet build $consumer -c Release --framework $framework --force --no-incremental -p:EventHubConsumerPackageVersion=1.5.59-eventhub-validation "-p:RestoreAdditionalProjectSources=$feed" "-p:RestorePackagesPath=$candidateCache"
          if ($LASTEXITCODE -ne 0) { throw 'Consumer source is incompatible with the candidate package.' }
          $resolvedPackage = Join-Path $candidateCache 'akka.streams.azure.eventhub/1.5.59-eventhub-validation/akka.streams.azure.eventhub.1.5.59-eventhub-validation.nupkg'
          $builtPackage = Join-Path $feed 'Akka.Streams.Azure.EventHub.1.5.59-eventhub-validation.nupkg'
          if ((Get-FileHash $resolvedPackage).Hash -ne (Get-FileHash $builtPackage).Hash) { throw 'Consumer resolved a different candidate package.' }
          $libraryFramework = if ($IsWindows) { 'netstandard2.0' } else { 'net6.0' }
          $candidate = "src/Azure/Akka.Streams.Azure.EventHub/bin/Release/$libraryFramework"
          Copy-Item $originalBinary $binary -Force
          if ((Get-FileHash $binary).Hash -ne $before) { throw 'Consumer was changed after compilation.' }
          if ((Get-FileHash "$output/Akka.Streams.Azure.EventHub.dll").Hash -ne (Get-FileHash "$candidate/Akka.Streams.Azure.EventHub.dll").Hash) {
            throw 'Consumer did not receive the candidate library.'
          }
          if ($IsWindows) { & $binary } else { dotnet $binary }
          if ($LASTEXITCODE -ne 0) { throw 'Previously compiled consumer failed with the candidate.' }
        displayName: 'Validate API/TFMs and run unchanged released-package consumer with candidate'
      - pwsh: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packages = @(Get-ChildItem EventHubPackages/*.nupkg)
          if ($packages.Count -ne 1) { throw 'Expected exactly one Event Hubs package.' }
          $package = $packages[0]
          $archive = [IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $nuspecEntry = @($archive.Entries | Where-Object FullName -like '*.nuspec')
            if ($nuspecEntry.Count -ne 1) { throw 'Expected exactly one package manifest.' }
            $reader = [IO.StreamReader]::new($nuspecEntry[0].Open())
            try { [xml]$nuspec = $reader.ReadToEnd() } finally { $reader.Dispose() }
            if ($nuspec.package.metadata.id -ne 'Akka.Streams.Azure.EventHub') { throw 'Unexpected package identity.' }
            $version = $nuspec.package.metadata.version
            $readmePath = [string]$nuspec.package.metadata.readme
            if (!$readmePath) { throw 'NuGet manifest does not declare a README.' }
            $entry = $archive.GetEntry($readmePath)
            if (!$entry) { throw 'README is absent from NuGet archive.' }
            $reader = [IO.StreamReader]::new($entry.Open())
            try { $readme = $reader.ReadToEnd() } finally { $reader.Dispose() }
            $sourceReadme = Get-Content src/Azure/Akka.Streams.Azure.EventHub/README.md -Raw
            if ($readme -cne $sourceReadme) { throw 'Packaged README differs from the source.' }
            foreach ($tfm in @('net6.0', 'netstandard2.0')) {
              if (!$archive.GetEntry("lib/$tfm/Akka.Streams.Azure.EventHub.dll")) { throw "Missing retained TFM $tfm." }
            }
          } finally { $archive.Dispose() }

          $examples = [regex]::Matches($readme, '(?s)```csharp\r?\n(.*?)```')
          if ($examples.Count -ne 2) { throw 'Expected two complete README examples.' }
          $feed = [Security.SecurityElement]::Escape((Resolve-Path EventHubPackages).Path)
          $cache = [Security.SecurityElement]::Escape((Join-Path '$(Agent.TempDirectory)' ("eventhub-readme-{0}-packages" -f [guid]::NewGuid().ToString('N'))))
          for ($i = 0; $i -lt $examples.Count; $i++) {
            $directory = Join-Path '$(Agent.TempDirectory)' "eventhub-readme-$i"
            New-Item $directory -ItemType Directory -Force | Out-Null
            Set-Content "$directory/Program.cs" $examples[$i].Groups[1].Value
            Set-Content "$directory/Example.csproj" "<Project Sdk='Microsoft.NET.Sdk'><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable><RestoreSources>$feed;https://api.nuget.org/v3/index.json</RestoreSources><RestorePackagesPath>$cache</RestorePackagesPath></PropertyGroup><ItemGroup><PackageReference Include='Akka.Streams.Azure.EventHub' Version='$version' /></ItemGroup></Project>"
            dotnet build "$directory/Example.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { throw "README example $i did not compile." }
          }
        displayName: 'Inspect NuGet README/TFMs and compile the shipped examples'
      - task: PublishTestResults@2
        condition: always()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: EventHubResults/*.trx
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: true
