# Pull request validation for Windows against the `dev` and `master` branches
# See https://docs.microsoft.com/en-us/azure/devops/pipelines/yaml-schema for reference
trigger:
  branches:
    include:
      - dev
      - v1.*
      - master
      - feature/*

pr:
  autoCancel: true # indicates whether additional pushes to a PR should cancel in-progress runs for the same PR. Defaults to true
  branches:
    include: [ dev, v1.*, master, feature/* ] # branch names which will trigger a build

name: $(Year:yyyy).$(Month).$(DayOfMonth)$(Rev:.r)

jobs:
  - template: azure-pipeline.template.yaml
    parameters:
      name: 'net_tests_linux'
      displayName: '.NET Unit Tests (Linux)'
      vmImage: 'ubuntu-latest'
      scriptFileName: './build.sh'
      scriptArgs: runTestsNet
      outputDirectory: 'TestResults'
      artifactName: 'net_tests_linux-$(Build.BuildId)'
      amqpTestUseDocker: true # Flag for AQMP test to use RabbitMQ docker
  - job: csv_validation
    displayName: 'Csv integration and compatibility'
    timeoutInMinutes: 30
    strategy:
      matrix:
        linux:
          image: ubuntu-latest
          csvFramework: net10.0
          csvFilter: FullyQualifiedName~Akka.Streams.Csv.Tests
        windows:
          image: windows-latest
          csvFramework: net48
          csvFilter: FullyQualifiedName~Akka.Streams.Csv.Tests
    pool:
      vmImage: $(image)
    steps:
      - checkout: self
      - task: UseDotNet@2
        inputs:
          packageType: sdk
          useGlobalJson: true
      - pwsh: |
          dotnet test src/Csv/Akka.Streams.Csv.Tests/Akka.Streams.Csv.Tests.csproj -c Release --framework "$(csvFramework)" --filter "$(csvFilter)" --logger "trx;LogFileName=csv.trx" --results-directory CsvResults
          if ($LASTEXITCODE -ne 0) { throw 'Csv tests failed.' }
        displayName: 'Run Csv required tests'
      - pwsh: |
          [xml]$trx = Get-Content CsvResults/csv.trx -Raw
          $results = @($trx.TestRun.Results.UnitTestResult)
          $required = @{
            A_dangling_escape_at_stream_eof_still_fails = 4
            An_escape_at_a_chunk_boundary_waits_for_its_following_byte = 5
            An_invalid_escape_after_a_chunk_boundary_still_fails = 2
            Buffered_final_rows_respect_demand_and_completion_without_an_extra_pull = 1
            CsvFormatter_quoting_everything_should_format_strings = 1
            CsvFormatter_quoting_everything_should_format_strings_containing_quotes = 1
            CsvFormatter_quoting_everything_should_format_strings_containing_quotes_twice = 1
            CsvFormatter_quoting_everything_should_format_strings_with_commas = 1
            CsvFormatter_with_comma_delimiter_should_format_strings = 1
            CsvFormatter_with_comma_delimiter_should_format_strings_containing_commas = 1
            CsvFormatter_with_comma_delimiter_should_format_strings_containing_quotes = 1
            CsvFormatter_with_non_standard_charset_should_get_the_encoding_right = 1
            CsvFormatter_with_required_quoting_should_duplicate_escape_char = 1
            CsvFormatter_with_required_quoting_should_duplicate_escape_chars_and_quotes = 1
            CsvFormatter_with_required_quoting_should_format_strings = 1
            CsvFormatter_with_required_quoting_should_quote_strings_containing_CR_LF = 1
            CsvFormatter_with_required_quoting_should_quote_strings_containing_LF = 1
            CsvFormatter_with_required_quoting_should_quote_strings_with_delimiters = 1
            CsvFormatter_with_required_quoting_should_quote_strings_with_just_a_quote = 1
            CsvFormatter_with_required_quoting_should_quote_strings_with_quotes = 1
            CsvFormatter_with_required_quoting_should_quote_strings_with_quotes_at_end = 1
            CsvFormatting_should_format_simple_value = 1
            CsvFormatting_should_include_Byte_Order_Mark = 1
            CsvParser_should_fail_on_escape_at_line_end = 1
            CsvParser_should_fail_on_escape_within_field_at_line_end = 1
            CsvParser_should_fail_on_escape_within_quoted_field_at_line_end = 1
            CsvParser_should_fail_on_escaped_quote_as_quotes_are_escaped_by_doubled_quote_chars = 1
            CsvParser_should_ignore_trailing_CR_LF = 1
            CsvParser_should_ignore_trailing_LF = 1
            CsvParser_should_keep_whitespace = 1
            CsvParser_should_not_deliver_input_until_end_of_line_is_reached = 1
            CsvParser_should_parse_UTF8_chars_unchanged = 1
            CsvParser_should_parse_an_empty_line_with_CR_LF_into_a_single_column = 1
            CsvParser_should_parse_an_empty_line_with_LF_into_a_single_column = 1
            CsvParser_should_parse_double_comma_to_be_an_empty_column = 1
            CsvParser_should_parse_double_escape_chars_into_one_escape_char = 1
            CsvParser_should_parse_double_quote_chars_into_empty_column = 1
            CsvParser_should_parse_double_quote_within_quotes_into_one_quote = 1
            CsvParser_should_parse_double_quote_within_quotes_into_one_quote_at_end_of_value = 1
            CsvParser_should_parse_empty_input_to_null = 1
            CsvParser_should_parse_escaped_comma_into_comma = 1
            CsvParser_should_parse_escaped_escape_in_text_within_quotes_into_quote = 1
            CsvParser_should_parse_escaped_escape_within_quotes_into_quote = 1
            CsvParser_should_parse_escaped_quote_in_text_within_quotes_into_quote = 1
            CsvParser_should_parse_escaped_quote_within_quotes_into_quote = 1
            CsvParser_should_parse_leading_comma_to_be_an_empty_column = 1
            CsvParser_should_parse_quoted_escape_chars_into_one_escape_char = 1
            CsvParser_should_parse_trailing_comma_to_be_an_empty_column = 1
            CsvParser_should_preserve_Unicode_L_SEP_0x2028_inside_a_field = 1
            CsvParser_should_quoted_values_keep_whitespace = 1
            CsvParser_should_quoted_values_may_contain_CR_LF = 1
            CsvParser_should_quoted_values_may_contain_LF = 1
            CsvParser_should_read_a_line_if_line_end_is_not_required = 1
            CsvParser_should_read_comma_separated_values_into_a_list = 1
            CsvParser_should_read_two_lines_into_two_lists = 1
            CsvParser_should_read_values_with_different_separator = 1
            CsvParser_should_take_double_double_quote_as_single_double_quote = 1
            CsvParsing_should_emit_completion_even_without_new_line_at_end = 1
            CsvParsing_should_parse_Apple_Numbers_exported_file = 1
            CsvParsing_should_parse_Google_Docs_exported_file = 1
            CsvParsing_should_parse_chunks_successfully = 1
            CsvParsing_should_parse_one_line = 1
            CsvParsing_should_parse_semicolon_lines = 1
            CsvParsing_should_parse_two_line = 1
            CsvParsing_should_parse_two_line_even_without_line_end = 1
            CsvParsing_should_parse_uniVocity_correctness_test = 1
            CsvToDictionary_should_be_OK_with_fewer_header_columns_than_data = 1
            CsvToDictionary_should_be_OK_with_more_header_columns_than_data = 1
            CsvToDictionary_should_parse_header_line_and_data_line_into_dictionary = 1
            CsvToDictionary_should_use_column_names_and_data_line_into_map = 1
            Csv_parsing_with_Byte_Order_Mark_should_accept_UTF8_BOM = 1
            Csv_parsing_with_Byte_Order_Mark_should_fail_for_UTF16_BE_BOM = 1
            Csv_parsing_with_Byte_Order_Mark_should_fail_for_UTF16_LE_BOM = 1
            Csv_parsing_with_Byte_Order_Mark_should_fail_for_UTF32_BE_BOM = 1
            Csv_parsing_with_Byte_Order_Mark_should_fail_for_UTF32_LE_BOM = 1
            Downstream_cancellation_reaches_the_byte_source = 1
            Standalone_cr_and_extra_blank_lines_survive_crlf_boundary_handling = 1
            Utf8_bom_quotes_and_crlf_are_preserved_across_byte_chunk_boundaries = 3
          }
          if ($results.Count -eq 0 -or @($results | Where-Object outcome -ne Passed).Count -gt 0) {
            throw 'Every discovered test must execute and pass; empty or skipped runs are invalid.'
          }
          if (@($results.testName | Select-Object -Unique).Count -ne $results.Count) {
            throw 'Duplicate test cases cannot replace required coverage.'
          }
          foreach ($case in $required.GetEnumerator()) {
            $matching = @($results | Where-Object testName -match "\.$($case.Key)(\(|$)")
            if ($matching.Count -ne $case.Value) { throw "Missing or duplicate cases for $($case.Key)." }
          }
        displayName: 'Require named cases and reject empty or skipped TRX runs'
      - pwsh: |
          $consumer = 'compatibility/CsvConsumer/CsvCompatibilityConsumer.csproj'
          $framework = if ($IsWindows) { 'net48' } else { 'net10.0' }
          dotnet build $consumer -c Release --framework $framework
          if ($LASTEXITCODE -ne 0) { throw 'Old consumer compilation failed.' }
          $output = "compatibility/CsvConsumer/bin/Release/$framework"
          $binary = if ($IsWindows) { "$output/CsvCompatibilityConsumer.exe" } else { "$output/CsvCompatibilityConsumer.dll" }
          $before = (Get-FileHash $binary).Hash
          $originalBinary = Join-Path '$(Agent.TempDirectory)' ([IO.Path]::GetFileName($binary))
          Copy-Item $binary $originalBinary -Force
          if ($IsWindows) { & $binary } else { dotnet $binary }
          if ($LASTEXITCODE -ne 0) { throw 'Released-package consumer execution failed.' }

          dotnet pack src/Csv/Akka.Streams.Csv/Akka.Streams.Csv.csproj -c Release -p:PackageVersion=1.5.59-csv-validation -o CsvPackages
          if ($LASTEXITCODE -ne 0) { throw 'Package creation or API/TFM validation failed.' }
          $feed = (Resolve-Path CsvPackages).Path
          $candidateCache = Join-Path '$(Agent.TempDirectory)' ("csv-consumer-{0}-{1}-packages" -f $framework, [guid]::NewGuid().ToString('N'))
          # Resolve dependencies and binding configuration for the consumer's own TFM.
          dotnet build $consumer -c Release --framework $framework --force --no-incremental -p:CsvConsumerPackageVersion=1.5.59-csv-validation "-p:RestoreAdditionalProjectSources=$feed" "-p:RestorePackagesPath=$candidateCache"
          if ($LASTEXITCODE -ne 0) { throw 'Consumer source is incompatible with the candidate package.' }
          $resolvedPackage = Join-Path $candidateCache 'akka.streams.csv/1.5.59-csv-validation/akka.streams.csv.1.5.59-csv-validation.nupkg'
          $builtPackage = Join-Path $feed 'Akka.Streams.Csv.1.5.59-csv-validation.nupkg'
          if ((Get-FileHash $resolvedPackage).Hash -ne (Get-FileHash $builtPackage).Hash) { throw 'Consumer resolved a different candidate package.' }
          $libraryFramework = if ($IsWindows) { 'netstandard2.0' } else { 'net6.0' }
          $candidate = "src/Csv/Akka.Streams.Csv/bin/Release/$libraryFramework"
          Copy-Item $originalBinary $binary -Force
          if ((Get-FileHash $binary).Hash -ne $before) { throw 'Consumer was changed after compilation.' }
          if ((Get-FileHash "$output/Akka.Streams.Csv.dll").Hash -ne (Get-FileHash "$candidate/Akka.Streams.Csv.dll").Hash) {
            throw 'Consumer did not receive the candidate library.'
          }
          if ($IsWindows) { & $binary } else { dotnet $binary }
          if ($LASTEXITCODE -ne 0) { throw 'Previously compiled consumer failed with the candidate.' }
        displayName: 'Validate API/TFMs and run unchanged released-package consumer with candidate'
      - pwsh: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packages = @(Get-ChildItem CsvPackages/*.nupkg)
          if ($packages.Count -ne 1) { throw 'Expected exactly one Csv package.' }
          $package = $packages[0]
          $archive = [IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $nuspecEntry = @($archive.Entries | Where-Object FullName -like '*.nuspec')
            if ($nuspecEntry.Count -ne 1) { throw 'Expected exactly one package manifest.' }
            $reader = [IO.StreamReader]::new($nuspecEntry[0].Open())
            try { [xml]$nuspec = $reader.ReadToEnd() } finally { $reader.Dispose() }
            if ($nuspec.package.metadata.id -ne 'Akka.Streams.Csv') { throw 'Unexpected package identity.' }
            $version = $nuspec.package.metadata.version
            $readmePath = [string]$nuspec.package.metadata.readme
            if (!$readmePath) { throw 'NuGet manifest does not declare a README.' }
            $entry = $archive.GetEntry($readmePath)
            if (!$entry) { throw 'README is absent from NuGet archive.' }
            $reader = [IO.StreamReader]::new($entry.Open())
            try { $readme = $reader.ReadToEnd() } finally { $reader.Dispose() }
            $sourceReadme = Get-Content src/Csv/Akka.Streams.Csv/README.md -Raw
            if ($readme -cne $sourceReadme) { throw 'Packaged README differs from the source.' }
            foreach ($tfm in @('net6.0', 'netstandard2.0')) {
              if (!$archive.GetEntry("lib/$tfm/Akka.Streams.Csv.dll")) { throw "Missing retained TFM $tfm." }
            }
          } finally { $archive.Dispose() }

          $examples = [regex]::Matches($readme, '(?s)```csharp\r?\n(.*?)```')
          if ($examples.Count -ne 2) { throw 'Expected two complete README examples.' }
          $feed = [Security.SecurityElement]::Escape((Resolve-Path CsvPackages).Path)
          $cache = [Security.SecurityElement]::Escape((Join-Path '$(Agent.TempDirectory)' ("csv-readme-{0}-packages" -f [guid]::NewGuid().ToString('N'))))
          for ($i = 0; $i -lt $examples.Count; $i++) {
            $directory = Join-Path '$(Agent.TempDirectory)' "csv-readme-$i"
            New-Item $directory -ItemType Directory -Force | Out-Null
            Set-Content "$directory/Program.cs" $examples[$i].Groups[1].Value
            Set-Content "$directory/Example.csproj" "<Project Sdk='Microsoft.NET.Sdk'><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable><RestoreSources>$feed;https://api.nuget.org/v3/index.json</RestoreSources><RestorePackagesPath>$cache</RestorePackagesPath></PropertyGroup><ItemGroup><PackageReference Include='Akka.Streams.Csv' Version='$version' /></ItemGroup></Project>"
            dotnet build "$directory/Example.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { throw "README example $i did not compile." }
          }
        displayName: 'Inspect NuGet README/TFMs and compile the shipped examples'
      - pwsh: |
          $env:CSV_OUTPUT = Join-Path '$(Agent.TempDirectory)' 'csv-readme-roundtrip.csv'
          $env:CSV_INPUT = $env:CSV_OUTPUT
          dotnet "$(Agent.TempDirectory)/csv-readme-0/bin/Release/net10.0/Example.dll"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged README writer failed.' }
          $bytes = [IO.File]::ReadAllBytes($env:CSV_OUTPUT)
          if ($bytes.Length -lt 3 -or [BitConverter]::ToString($bytes[0..2]) -ne 'EF-BB-BF') {
            throw 'README writer did not emit the configured UTF-8 BOM.'
          }
          $lines = @(dotnet "$(Agent.TempDirectory)/csv-readme-1/bin/Release/net10.0/Example.dll")
          if ($LASTEXITCODE -ne 0) { throw 'Packaged README reader failed.' }
          $actual = [string]::Join("`n", $lines)
          $expected = 'café: comma, quote " and newline' + "`n" + 'inside' + "`n" + 'last: plain'
          if ($actual -cne $expected) { throw "README round-trip output differed: $actual" }
        displayName: 'Run both packaged README examples against the real filesystem'
      - task: PublishTestResults@2
        condition: always()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: CsvResults/*.trx
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: true
