# Pull request validation for Windows against the `dev` and `master` branches
# See https://docs.microsoft.com/en-us/azure/devops/pipelines/yaml-schema for reference
trigger:
  branches:
    include:
      - dev
      - v1.*
      - master
      - feature/*

pr:
  autoCancel: true # indicates whether additional pushes to a PR should cancel in-progress runs for the same PR. Defaults to true
  branches:
    include: [ dev, v1.*, master, feature/* ] # branch names which will trigger a build

name: $(Year:yyyy).$(Month).$(DayOfMonth)$(Rev:.r)

jobs:
  - template: azure-pipeline.template.yaml
    parameters:
      name: 'net_tests_linux'
      displayName: '.NET Unit Tests (Linux)'
      vmImage: 'ubuntu-latest'
      scriptFileName: './build.sh'
      scriptArgs: runTestsNet
      outputDirectory: 'TestResults'
      artifactName: 'net_tests_linux-$(Build.BuildId)'
      amqpTestUseDocker: true # Flag for AQMP test to use RabbitMQ docker
  - job: signalr_validation
    displayName: 'SignalR integration and compatibility'
    timeoutInMinutes: 30
    strategy:
      matrix:
        linux:
          image: ubuntu-latest
          signalrFramework: net10.0
          signalrFilter: FullyQualifiedName~Akka.Streams.SignalR.Tests
        windows:
          image: windows-latest
          signalrFramework: net10.0
          signalrFilter: FullyQualifiedName~Akka.Streams.SignalR.Tests
    pool:
      vmImage: $(image)
    steps:
      - checkout: self
      - task: UseDotNet@2
        inputs:
          packageType: sdk
          useGlobalJson: true
      - pwsh: |
          dotnet test src/SignalR/Akka.Streams.SignalR.Tests/Akka.Streams.SignalR.Tests.csproj -c Release --framework "$(signalrFramework)" --filter "$(signalrFilter)" --logger "trx;LogFileName=signalr.trx" --results-directory SignalRResults
          if ($LASTEXITCODE -ne 0) { throw 'SignalR tests failed.' }
        displayName: 'Run SignalR required tests'
      - pwsh: |
          [xml]$trx = Get-Content SignalRResults/signalr.trx -Raw
          $results = @($trx.TestRun.Results.UnitTestResult)
          $required = @{
            A_pending_send_does_not_block_upstream_failure = 3
            Closing_and_replacing_a_native_client_keeps_the_shared_stream_usable = 1
            Failed_and_canceled_transport_tasks_fail_the_open_stream = 6
            Native_websockets_receive_exact_payloads_and_honor_routing_and_exclusions = 3
            Sends_keep_their_target_payload_and_sequential_order = 3
            Websocket_connection_should_be_able_to_receive_data = 1
            Websocket_connection_should_be_able_to_send_data = 1
            Websocket_stream_should_work_when_client_closes = 1
            Websocket_stream_should_work_when_used_by_multiple_flows = 1
          }
          if ($results.Count -eq 0 -or @($results | Where-Object outcome -ne Passed).Count -gt 0) {
            throw 'Every discovered test must execute and pass; empty or skipped runs are invalid.'
          }
          if (@($results.testName | Select-Object -Unique).Count -ne $results.Count) {
            throw 'Duplicate test cases cannot replace required coverage.'
          }
          foreach ($case in $required.GetEnumerator()) {
            $matching = @($results | Where-Object testName -match "\.$($case.Key)(\(|$)")
            if ($matching.Count -ne $case.Value) { throw "Missing or duplicate cases for $($case.Key)." }
          }
        displayName: 'Require named cases and reject empty or skipped TRX runs'
      - pwsh: |
          $consumer = 'compatibility/SignalRConsumer/SignalRCompatibilityConsumer.csproj'
          $framework = 'net10.0'
          dotnet build $consumer -c Release --framework $framework
          if ($LASTEXITCODE -ne 0) { throw 'Old consumer compilation failed.' }
          $output = "compatibility/SignalRConsumer/bin/Release/$framework"
          $binary = "$output/SignalRCompatibilityConsumer.dll"
          $before = (Get-FileHash $binary).Hash
          $originalBinary = Join-Path '$(Agent.TempDirectory)' ([IO.Path]::GetFileName($binary))
          Copy-Item $binary $originalBinary -Force
          dotnet $binary
          if ($LASTEXITCODE -ne 0) { throw 'Released-package consumer execution failed.' }

          dotnet pack src/SignalR/Akka.Streams.SignalR/Akka.Streams.SignalR.csproj -c Release -p:PackageVersion=1.5.59-signalr-validation -o SignalRPackages
          if ($LASTEXITCODE -ne 0) { throw 'Package creation or API/TFM validation failed.' }
          $feed = (Resolve-Path SignalRPackages).Path
          $candidateCache = Join-Path '$(Agent.TempDirectory)' ("signalr-consumer-{0}-{1}-packages" -f $framework, [guid]::NewGuid().ToString('N'))
          # Resolve dependencies and binding configuration for the consumer's own TFM.
          dotnet build $consumer -c Release --framework $framework --force --no-incremental -p:SignalRConsumerPackageVersion=1.5.59-signalr-validation "-p:RestoreAdditionalProjectSources=$feed" "-p:RestorePackagesPath=$candidateCache"
          if ($LASTEXITCODE -ne 0) { throw 'Consumer source is incompatible with the candidate package.' }
          $resolvedPackage = Join-Path $candidateCache 'akka.streams.signalr/1.5.59-signalr-validation/akka.streams.signalr.1.5.59-signalr-validation.nupkg'
          $builtPackage = Join-Path $feed 'Akka.Streams.SignalR.1.5.59-signalr-validation.nupkg'
          if ((Get-FileHash $resolvedPackage).Hash -ne (Get-FileHash $builtPackage).Hash) { throw 'Consumer resolved a different candidate package.' }
          $libraryFramework = 'net6.0'
          $candidate = "src/SignalR/Akka.Streams.SignalR/bin/Release/$libraryFramework"
          Copy-Item $originalBinary $binary -Force
          if ((Get-FileHash $binary).Hash -ne $before) { throw 'Consumer was changed after compilation.' }
          if ((Get-FileHash "$output/Akka.Streams.SignalR.dll").Hash -ne (Get-FileHash "$candidate/Akka.Streams.SignalR.dll").Hash) {
            throw 'Consumer did not receive the candidate library.'
          }
          dotnet $binary
          if ($LASTEXITCODE -ne 0) { throw 'Previously compiled consumer failed with the candidate.' }
        displayName: 'Validate API/TFMs and run unchanged released-package consumer with candidate'
      - pwsh: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packages = @(Get-ChildItem SignalRPackages/*.nupkg)
          if ($packages.Count -ne 1) { throw 'Expected exactly one SignalR package.' }
          $package = $packages[0]
          $archive = [IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $nuspecEntry = @($archive.Entries | Where-Object FullName -like '*.nuspec')
            if ($nuspecEntry.Count -ne 1) { throw 'Expected exactly one package manifest.' }
            $reader = [IO.StreamReader]::new($nuspecEntry[0].Open())
            try { [xml]$nuspec = $reader.ReadToEnd() } finally { $reader.Dispose() }
            if ($nuspec.package.metadata.id -ne 'Akka.Streams.SignalR') { throw 'Unexpected package identity.' }
            $version = $nuspec.package.metadata.version
            $readmePath = [string]$nuspec.package.metadata.readme
            if (!$readmePath) { throw 'NuGet manifest does not declare a README.' }
            $entry = $archive.GetEntry($readmePath)
            if (!$entry) { throw 'README is absent from NuGet archive.' }
            $reader = [IO.StreamReader]::new($entry.Open())
            try { $readme = $reader.ReadToEnd() } finally { $reader.Dispose() }
            $sourceReadme = Get-Content src/SignalR/Akka.Streams.SignalR/README.md -Raw
            if ($readme -cne $sourceReadme) { throw 'Packaged README differs from the source.' }
            foreach ($tfm in @('net6.0')) {
              if (!$archive.GetEntry("lib/$tfm/Akka.Streams.SignalR.dll")) { throw "Missing retained TFM $tfm." }
            }
          } finally { $archive.Dispose() }

          $examples = [regex]::Matches($readme, '(?s)```csharp\r?\n(.*?)```')
          if ($examples.Count -ne 2) { throw 'Expected two complete README examples.' }
          $feed = [Security.SecurityElement]::Escape((Resolve-Path SignalRPackages).Path)
          $cache = [Security.SecurityElement]::Escape((Join-Path '$(Agent.TempDirectory)' ("signalr-readme-{0}-packages" -f [guid]::NewGuid().ToString('N'))))
          [xml]$central = Get-Content Directory.Packages.props -Raw
          $clientVersion = [string]($central.Project.ItemGroup.PackageVersion | Where-Object Include -eq 'Microsoft.AspNetCore.SignalR.Client').Version
          if (!$clientVersion) { throw 'Missing centrally managed SignalR client version.' }
          for ($i = 0; $i -lt $examples.Count; $i++) {
            $directory = Join-Path '$(Agent.TempDirectory)' "signalr-readme-$i"
            New-Item $directory -ItemType Directory -Force | Out-Null
            Set-Content "$directory/Program.cs" $examples[$i].Groups[1].Value
            $sdk = if ($i -eq 0) { 'Microsoft.NET.Sdk.Web' } else { 'Microsoft.NET.Sdk' }
            $clientReference = if ($i -eq 1) { "<PackageReference Include='Microsoft.AspNetCore.SignalR.Client' Version='$clientVersion' />" } else { '' }
            Set-Content "$directory/Example.csproj" "<Project Sdk='$sdk'><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable><RestoreSources>$feed;https://api.nuget.org/v3/index.json</RestoreSources><RestorePackagesPath>$cache</RestorePackagesPath></PropertyGroup><ItemGroup><PackageReference Include='Akka.Streams.SignalR' Version='$version' />$clientReference</ItemGroup></Project>"
            dotnet build "$directory/Example.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { throw "README example $i did not compile." }
          }
        displayName: 'Inspect NuGet README/TFMs and compile the shipped examples'
      - pwsh: |
          $start = [Diagnostics.ProcessStartInfo]::new((Get-Command dotnet).Source)
          $start.UseShellExecute = $false
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $start.ArgumentList.Add('$(Agent.TempDirectory)/signalr-readme-0/bin/Release/net10.0/Example.dll')
          $start.ArgumentList.Add('--urls')
          $start.ArgumentList.Add('http://127.0.0.1:0')
          $server = [Diagnostics.Process]::Start($start)
          $errors = $server.StandardError.ReadToEndAsync()
          $remainingOutput = $null
          try {
            $startup = [Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds(30))
            try {
              while ($true) {
                $line = $server.StandardOutput.ReadLineAsync($startup.Token).AsTask().GetAwaiter().GetResult()
                if ($null -eq $line) { throw 'Packaged README server exited before reporting its endpoint.' }
                if ($line -match '^SIGNALR_READY (http://127\.0\.0\.1:\d+/echo)$') { $env:SIGNALR_URL = $Matches[1]; break }
              }
            } finally { $startup.Dispose() }
            $remainingOutput = $server.StandardOutput.ReadToEndAsync()
            $reply = @(dotnet '$(Agent.TempDirectory)/signalr-readme-1/bin/Release/net10.0/Example.dll')
            if ($LASTEXITCODE -ne 0) { throw 'Packaged README SignalR client failed.' }
            if ([string]::Join("`n", $reply) -cne 'Hello café') { throw 'Packaged README echo differed.' }
          } finally {
            try {
              if (!$server.HasExited) { $server.Kill($true) }
              if (!$server.WaitForExit(10000)) { throw 'Owned README server did not stop.' }
            } finally { $server.Dispose() }
          }
        displayName: 'Run packaged README server/client through a real dynamic WebSocket endpoint'
      - task: PublishTestResults@2
        condition: always()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: SignalRResults/*.trx
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: true
