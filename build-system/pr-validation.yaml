              foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                if ($package -and $package.vulnerabilities) {
                  throw "Vulnerable package $($package.id) $($package.resolvedVersion) in $project."
                }
              }
            }
            Write-Host "NuGet package audit passed: $project"
          }
        displayName: 'Audit SignalR product and exact packaged README consumers'
      - pwsh: |
          $start = [Diagnostics.ProcessStartInfo]::new((Get-Command dotnet).Source)
          $start.UseShellExecute = $false
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $start.ArgumentList.Add('$(Agent.TempDirectory)/signalr-readme-0/bin/Release/net10.0/Example.dll')
          $start.ArgumentList.Add('--urls')
          $start.ArgumentList.Add('http://127.0.0.1:0')
          $server = [Diagnostics.Process]::Start($start)
          $errors = $server.StandardError.ReadToEndAsync()
          $remainingOutput = $null
          try {
            $startup = [Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds(30))
            try {
              while ($true) {
                $line = $server.StandardOutput.ReadLineAsync($startup.Token).AsTask().GetAwaiter().GetResult()
                if ($null -eq $line) { throw 'Packaged README server exited before reporting its endpoint.' }
                if ($line -match '^SIGNALR_READY (http://127\.0\.0\.1:\d+/echo)$') { $env:SIGNALR_URL = $Matches[1]; break }
              }
            } finally { $startup.Dispose() }
            $remainingOutput = $server.StandardOutput.ReadToEndAsync()
            $reply = @(dotnet '$(Agent.TempDirectory)/signalr-readme-1/bin/Release/net10.0/Example.dll')
            if ($LASTEXITCODE -ne 0) { throw 'Packaged README SignalR client failed.' }
            if ([string]::Join("`n", $reply) -cne 'Hello café') { throw 'Packaged README echo differed.' }
          } finally {
            try {
              if (!$server.HasExited) { $server.Kill($true) }
              if (!$server.WaitForExit(10000)) { throw 'Owned README server did not stop.' }
            } finally { $server.Dispose() }
          }
        displayName: 'Run packaged README server/client through a real dynamic WebSocket endpoint'
      - task: PublishTestResults@2
        condition: always()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: SignalRResults/*.trx
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: true
  - job: amqp_v1_validation
    displayName: 'AMQP 1.0 integration and compatibility'
    timeoutInMinutes: 30
    strategy:
      matrix:
        linux:
          image: ubuntu-latest
        windows:
          image: windows-latest
    pool:
      vmImage: $(image)
    steps:
      - checkout: self
      - task: UseDotNet@2
        inputs:
          packageType: sdk
          useGlobalJson: true
      - pwsh: |
          dotnet build src/Amqp/Akka.Streams.Amqp.V1.Tests/Akka.Streams.Amqp.V1.Tests.csproj -c Release --framework net48
          if ($LASTEXITCODE -ne 0) { throw '.NET Framework test compilation failed.' }
        displayName: 'Compile retained .NET Framework test target'
        condition: eq(variables['Agent.OS'], 'Windows_NT')
      - pwsh: |
          dotnet test src/Amqp/Akka.Streams.Amqp.V1.Tests/Akka.Streams.Amqp.V1.Tests.csproj -c Release --framework net10.0 --filter FullyQualifiedName~Akka.Streams.Amqp.V1.Tests --logger "trx;LogFileName=amqp-v1.trx" --results-directory AmqpV1Results
          if ($LASTEXITCODE -ne 0) { throw 'AMQP 1.0 tests failed.' }
        displayName: 'Run AMQP 1.0 integration tests'
        condition: eq(variables['Agent.OS'], 'Linux')
      - pwsh: |
          [xml]$trx = Get-Content AmqpV1Results/amqp-v1.trx -Raw
          $results = @($trx.TestRun.Results.UnitTestResult)
          $required = @{
            Publish_and_consume_elements_through_a_simple_queue_again_in_the_same_process = 1
            TestHelloWorld = 1
            Named_and_address_settings_interoperate_with_native_peers_and_close_their_links = 2
            A_closed_sender_faults_the_materialized_task_instead_of_leaving_it_pending = 1
            A_closed_receiver_fails_the_source_and_keeps_the_borrowed_session_open = 1
            A_serialization_failure_faults_the_materialized_task_with_the_original_error = 1
          }
          if ($results.Count -eq 0 -or @($results | Where-Object outcome -ne Passed).Count -gt 0) {
            throw 'Every discovered test must execute and pass; empty or skipped runs are invalid.'
          }
          if (@($results.testName | Select-Object -Unique).Count -ne $results.Count) {
            throw 'Duplicate test cases cannot replace required coverage.'
          }
          foreach ($case in $required.GetEnumerator()) {
            $matching = @($results | Where-Object testName -match "\.$($case.Key)(\(|$)")
            if ($matching.Count -ne $case.Value) { throw "Missing or duplicate cases for $($case.Key)." }
          }
        displayName: 'Require named cases and reject empty or skipped TRX runs'
        condition: eq(variables['Agent.OS'], 'Linux')
      - pwsh: |
          $consumer = 'compatibility/AmqpV1Consumer/AmqpV1CompatibilityConsumer.csproj'
          $framework = if ($IsWindows) { 'net48' } else { 'net10.0' }
          dotnet build $consumer -c Release --framework $framework
          if ($LASTEXITCODE -ne 0) { throw 'Old consumer compilation failed.' }
          $output = "compatibility/AmqpV1Consumer/bin/Release/$framework"
          $binary = if ($IsWindows) { "$output/AmqpV1CompatibilityConsumer.exe" } else { "$output/AmqpV1CompatibilityConsumer.dll" }
          $before = (Get-FileHash $binary).Hash
          $originalBinary = Join-Path '$(Agent.TempDirectory)' ([IO.Path]::GetFileName($binary))
          Copy-Item $binary $originalBinary -Force
          if ($IsWindows -and (Test-Path "$binary.config")) { Copy-Item "$binary.config" "$originalBinary.config" -Force }
          if ($IsWindows) { & $binary } else { dotnet $binary }
          if ($LASTEXITCODE -ne 0) { throw 'Released-package consumer execution failed.' }

          dotnet pack src/Amqp/Akka.Streams.Amqp.V1/Akka.Streams.Amqp.V1.csproj -c Release -p:PackageVersion=1.5.59-amqp-v1-validation -o AmqpV1Packages
          if ($LASTEXITCODE -ne 0) { throw 'Package creation or API/TFM validation failed.' }
          $feed = (Resolve-Path AmqpV1Packages).Path
          $candidateCache = Join-Path '$(Agent.TempDirectory)' "amqp-v1-consumer-$framework-packages"
          # Resolve dependencies and binding configuration for the consumer's own TFM.
          dotnet build $consumer -c Release --framework $framework --force --no-incremental -p:AmqpV1ConsumerPackageVersion=1.5.59-amqp-v1-validation "-p:RestoreAdditionalProjectSources=$feed" "-p:RestorePackagesPath=$candidateCache"
          if ($LASTEXITCODE -ne 0) { throw 'Consumer source is incompatible with the candidate package.' }
          $resolvedPackage = Join-Path $candidateCache 'akka.streams.amqp.v1/1.5.59-amqp-v1-validation/akka.streams.amqp.v1.1.5.59-amqp-v1-validation.nupkg'
          $builtPackage = Join-Path $feed 'Akka.Streams.Amqp.V1.1.5.59-amqp-v1-validation.nupkg'
          if ((Get-FileHash $resolvedPackage).Hash -ne (Get-FileHash $builtPackage).Hash) { throw 'Consumer resolved a different candidate package.' }
          if ($IsWindows) {
            & $binary
            if ($LASTEXITCODE -ne 0) { throw 'Recompiled Windows consumer failed with the candidate graph.' }
          }
          $libraryFramework = if ($IsWindows) { 'netstandard2.0' } else { 'net6.0' }
          $candidate = "src/Amqp/Akka.Streams.Amqp.V1/bin/Release/$libraryFramework"
          Copy-Item $originalBinary $binary -Force
          if ((Get-FileHash $binary).Hash -ne $before) { throw 'Consumer was changed after compilation.' }
          if ((Get-FileHash "$output/Akka.Streams.Amqp.V1.dll").Hash -ne (Get-FileHash "$candidate/Akka.Streams.Amqp.V1.dll").Hash) {
            throw 'Consumer did not receive the candidate library.'
          }
          if ($IsWindows) {
            # Include frozen IL when MSBuild generates standard output binding policy.
            Write-Host '##vso[task.setvariable variable=BindingDiagnosticAttempted]true'
            New-Item '$(Agent.TempDirectory)/amqp-binding-diagnostic/report' -ItemType Directory -Force | Out-Null
            ./build-system/diagnostics/Invoke-AmqpBindingDiagnostic.ps1 `
              -OriginalBinary '$(Agent.TempDirectory)/AmqpV1CompatibilityConsumer.exe' `
              -CandidateOutput 'compatibility/AmqpV1Consumer/bin/Release/net48' `
              -Feed 'AmqpV1Packages' `
              -ArtifactRoot '$(Agent.TempDirectory)/amqp-binding-diagnostic'
          } else {
            dotnet $binary
            if ($LASTEXITCODE -ne 0) { throw 'Previously compiled consumer failed with the candidate.' }
          }
        displayName: 'Validate API/TFMs and frozen consumer through standard NuGet upgrade resolution'
      - task: PublishBuildArtifacts@1
        displayName: 'Publish bounded binding diagnostic evidence'
        condition: and(always(), eq(variables['Agent.OS'], 'Windows_NT'), eq(variables['BindingDiagnosticAttempted'], 'true'))
        inputs:
          PathtoPublish: '$(Agent.TempDirectory)/amqp-binding-diagnostic/report'
          ArtifactName: 'amqp-binding-diagnostic'
          publishLocation: Container
      - pwsh: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packages = @(Get-ChildItem AmqpV1Packages/*.nupkg)
          if ($packages.Count -ne 1) { throw 'Expected exactly one AMQP 1.0 package.' }
          $package = $packages[0]
          $archive = [IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $nuspecEntry = @($archive.Entries | Where-Object FullName -like '*.nuspec')
            if ($nuspecEntry.Count -ne 1) { throw 'Expected exactly one package manifest.' }
            $reader = [IO.StreamReader]::new($nuspecEntry[0].Open())
            try { [xml]$nuspec = $reader.ReadToEnd() } finally { $reader.Dispose() }
            if ($nuspec.package.metadata.id -ne 'Akka.Streams.Amqp.V1') { throw 'Unexpected package identity.' }
            $version = $nuspec.package.metadata.version
            $readmePath = [string]$nuspec.package.metadata.readme
            if (!$readmePath) { throw 'NuGet manifest does not declare a README.' }
            $entry = $archive.GetEntry($readmePath)
            if (!$entry) { throw 'README is absent from NuGet archive.' }
            $reader = [IO.StreamReader]::new($entry.Open())
            try { $readme = $reader.ReadToEnd() } finally { $reader.Dispose() }
            $sourceReadme = Get-Content src/Amqp/Akka.Streams.Amqp.V1/README.md -Raw
            if ($readme -cne $sourceReadme) { throw 'Packaged README differs from the source.' }
            foreach ($tfm in @('net6.0', 'netstandard2.0')) {
              if (!$archive.GetEntry("lib/$tfm/Akka.Streams.Amqp.V1.dll")) { throw "Missing retained TFM $tfm." }
            }
          } finally { $archive.Dispose() }

          $examples = [regex]::Matches($readme, '(?s)```csharp\r?\n(.*?)```')
          if ($examples.Count -ne 1) { throw 'Expected one complete README example.' }
          $feed = [Security.SecurityElement]::Escape((Resolve-Path AmqpV1Packages).Path)
          $cache = [Security.SecurityElement]::Escape((Join-Path '$(Agent.TempDirectory)' 'amqp-v1-readme-packages'))
          for ($i = 0; $i -lt $examples.Count; $i++) {
            $directory = Join-Path '$(Agent.TempDirectory)' "amqp-v1-readme-$i"
            New-Item $directory -ItemType Directory -Force | Out-Null
            Set-Content "$directory/Program.cs" $examples[$i].Groups[1].Value
            Set-Content "$directory/Example.csproj" "<Project Sdk='Microsoft.NET.Sdk'><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><RestoreSources>$feed;https://api.nuget.org/v3/index.json</RestoreSources><RestorePackagesPath>$cache</RestorePackagesPath></PropertyGroup><ItemGroup><PackageReference Include='Akka.Streams.Amqp.V1' Version='$version' /></ItemGroup></Project>"
            dotnet build "$directory/Example.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { throw "README example $i did not compile." }
          }
        displayName: 'Inspect NuGet README/TFMs and compile the shipped examples'
      - task: PublishTestResults@2
        condition: and(always(), eq(variables['Agent.OS'], 'Linux'))
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: AmqpV1Results/*.trx
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: true
