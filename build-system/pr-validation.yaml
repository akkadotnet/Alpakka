  - template: standards-job.template.yaml
  - job: xml_validation
    displayName: 'Xml integration and compatibility'
    timeoutInMinutes: 30
    strategy:
      matrix:
        linux:
          image: ubuntu-latest
          xmlFramework: net10.0
          xmlFilter: FullyQualifiedName~Akka.Streams.Xml.Tests
        windows:
          image: windows-latest
          xmlFramework: net48
          xmlFilter: FullyQualifiedName~Akka.Streams.Xml.Tests
    pool:
      vmImage: $(image)
    steps:
      - checkout: self
      - task: UseDotNet@2
        inputs:
          packageType: sdk
          useGlobalJson: true
      - pwsh: |
          dotnet test src/Xml/Akka.Streams.Xml.Tests/Akka.Streams.Xml.Tests.csproj -c Release --framework "$(xmlFramework)" --filter "$(xmlFilter)" --logger "trx;LogFileName=xml.trx" --results-directory XmlResults
          if ($LASTEXITCODE -ne 0) { throw 'Xml tests failed.' }
        displayName: 'Run Xml required tests'
      - pwsh: |
          [xml]$trx = Get-Content XmlResults/xml.trx -Raw
          $results = @($trx.TestRun.Results.UnitTestResult)
          $required = @{
            A_text_token_split_across_byte_chunks_is_a_documented_parser_limitation = 1
            Element_events_are_balanced_and_complete_with_exact_demand = 5
            Malformed_xml_and_dtds_fail_the_stream = 2
            Namespace_events_retain_local_names_and_utf8_text = 1
            Parser_cancellation_reaches_the_byte_source = 1
