      - pwsh: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packages = @(Get-ChildItem CsvPackages/*.nupkg)
          if ($packages.Count -ne 1) { throw 'Expected exactly one Csv package.' }
          $package = $packages[0]
          $archive = [IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $nuspecEntry = @($archive.Entries | Where-Object FullName -like '*.nuspec')
            if ($nuspecEntry.Count -ne 1) { throw 'Expected exactly one package manifest.' }
            $reader = [IO.StreamReader]::new($nuspecEntry[0].Open())
            try { [xml]$nuspec = $reader.ReadToEnd() } finally { $reader.Dispose() }
            if ($nuspec.package.metadata.id -ne 'Akka.Streams.Csv') { throw 'Unexpected package identity.' }
            $version = $nuspec.package.metadata.version
            $readmePath = [string]$nuspec.package.metadata.readme
            if (!$readmePath) { throw 'NuGet manifest does not declare a README.' }
            $entry = $archive.GetEntry($readmePath)
            if (!$entry) { throw 'README is absent from NuGet archive.' }
            $reader = [IO.StreamReader]::new($entry.Open())
            try { $readme = $reader.ReadToEnd() } finally { $reader.Dispose() }
            $sourceReadme = Get-Content src/Csv/Akka.Streams.Csv/README.md -Raw
            if ($readme -cne $sourceReadme) { throw 'Packaged README differs from the source.' }
            foreach ($tfm in @('net6.0', 'netstandard2.0')) {
              if (!$archive.GetEntry("lib/$tfm/Akka.Streams.Csv.dll")) { throw "Missing retained TFM $tfm." }
            }
          } finally { $archive.Dispose() }

          $examples = [regex]::Matches($readme, '(?s)```csharp\r?\n(.*?)```')
          if ($examples.Count -ne 2) { throw 'Expected two complete README examples.' }
          $feed = [Security.SecurityElement]::Escape((Resolve-Path CsvPackages).Path)
          $cache = [Security.SecurityElement]::Escape((Join-Path '$(Agent.TempDirectory)' ("csv-readme-{0}-packages" -f [guid]::NewGuid().ToString('N'))))
          for ($i = 0; $i -lt $examples.Count; $i++) {
            $directory = Join-Path '$(Agent.TempDirectory)' "csv-readme-$i"
            New-Item $directory -ItemType Directory -Force | Out-Null
            Set-Content "$directory/Program.cs" $examples[$i].Groups[1].Value
            Set-Content "$directory/Example.csproj" "<Project Sdk='Microsoft.NET.Sdk'><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable><RestoreSources>$feed;https://api.nuget.org/v3/index.json</RestoreSources><RestorePackagesPath>$cache</RestorePackagesPath></PropertyGroup><ItemGroup><PackageReference Include='Akka.Streams.Csv' Version='$version' /></ItemGroup></Project>"
            dotnet build "$directory/Example.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { throw "README example $i did not compile." }
          }
        displayName: 'Inspect NuGet README/TFMs and compile the shipped examples'
      - pwsh: |
          $env:CSV_OUTPUT = Join-Path '$(Agent.TempDirectory)' 'csv-readme-roundtrip.csv'
          $env:CSV_INPUT = $env:CSV_OUTPUT
          dotnet "$(Agent.TempDirectory)/csv-readme-0/bin/Release/net10.0/Example.dll"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged README writer failed.' }
          $bytes = [IO.File]::ReadAllBytes($env:CSV_OUTPUT)
          if ($bytes.Length -lt 3 -or [BitConverter]::ToString($bytes[0..2]) -ne 'EF-BB-BF') {
            throw 'README writer did not emit the configured UTF-8 BOM.'
          }
          $lines = @(dotnet "$(Agent.TempDirectory)/csv-readme-1/bin/Release/net10.0/Example.dll")
          if ($LASTEXITCODE -ne 0) { throw 'Packaged README reader failed.' }
          $actual = [string]::Join("`n", $lines)
          $expected = 'café: comma, quote " and newline' + "`n" + 'inside' + "`n" + 'last: plain'
          if ($actual -cne $expected) { throw "README round-trip output differed: $actual" }
        displayName: 'Run both packaged README examples against the real filesystem'
      - task: PublishTestResults@2
        condition: always()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: CsvResults/*.trx
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: true
