# Pull request validation for Windows against the `dev` and `master` branches
# See https://docs.microsoft.com/en-us/azure/devops/pipelines/yaml-schema for reference
trigger:
  branches:
    include:
      - dev
      - v1.*
      - master
      - feature/*

pr:
  autoCancel: true # indicates whether additional pushes to a PR should cancel in-progress runs for the same PR. Defaults to true
  branches:
    include: [ dev, v1.*, master, feature/* ] # branch names which will trigger a build

name: $(Year:yyyy).$(Month).$(DayOfMonth)$(Rev:.r)

jobs:
  - template: azure-pipeline.template.yaml
    parameters:
      name: 'net_tests_linux'
      displayName: '.NET Unit Tests (Linux)'
      vmImage: 'ubuntu-latest'
      scriptFileName: './build.sh'
      scriptArgs: runTestsNet
      outputDirectory: 'TestResults'
      artifactName: 'net_tests_linux-$(Build.BuildId)'
      amqpTestUseDocker: true # Flag for AQMP test to use RabbitMQ docker
  - job: sqs_validation
    displayName: 'SQS integration and compatibility'
    timeoutInMinutes: 30
    strategy:
      matrix:
        linux:
          image: ubuntu-latest
          sqsFramework: net10.0
          sqsFilter: FullyQualifiedName~Akka.Streams.SQS.Tests
        windows:
          image: windows-latest
          sqsFramework: net48
          sqsFilter: FullyQualifiedName!~SqsIntegrationTests
    pool:
      vmImage: $(image)
    steps:
      - checkout: self
      - task: UseDotNet@2
        inputs:
          packageType: sdk
          useGlobalJson: true
      - pwsh: |
          dotnet test src/AWS/SQS/Akka.Streams.SQS.Tests/Akka.Streams.SQS.Tests.csproj -c Release --framework "$(sqsFramework)" --filter "$(sqsFilter)" --logger "trx;LogFileName=sqs.trx" --results-directory SqsResults
          if ($LASTEXITCODE -ne 0) { throw 'SQS tests failed.' }
        displayName: 'Run SQS required tests'
      - pwsh: |
          [xml]$trx = Get-Content SqsResults/sqs.trx -Raw
          $results = @($trx.TestRun.Results.UnitTestResult)
          $required = @{
            SqsAckFlow_default_stream_should_react_on_Delete_commands = 1
            SqsAckFlow_default_stream_should_react_on_ChangeVisibility_commands = 1
            SqsAckFlow_default_stream_should_react_on_Ignore_commands = 1
            SqsAckFlow_grouped_stream_should_react_on_Delete_commands = 1
            SqsAckFlow_grouped_stream_should_react_on_ChangeVisibility_commands = 1
            SqsAckFlow_grouped_stream_should_react_on_Ignore_commands = 1
            SqsPublishFlow_default_should_send_messages_to_SQS = 1
            SqsPublishFlow_grouped_should_send_messages_to_SQS_in_batches = 1
            SqsPublishFlow_grouped_should_fail_downstream_on_partial_failure = 1
            SqsPublishFlow_batch_should_send_messages_to_SQS_in_batches = 1
            SqsPublishFlow_batch_should_fail_downstream_on_partial_failures = 1
            SqsSource_should_return_events = 1
            SqsSource_when_closeOnEmptyReceive_should_complete_after_returning_empty_result = 1
            SqsSource_when_NOT_closeOnEmptyReceive_should_continue_after_returning_empty_result = 1
          }
          if (!$IsWindows) {
            $required['Publish_results_match_the_native_messages_for_each_mode'] = 3
            $required['Source_and_acknowledgment_flows_preserve_attributes_visibility_and_deletion'] = 2
            $required['Close_on_empty_receive_completes_without_disposing_the_borrowed_client'] = 1
            $required['Missing_queue_fails_the_source_without_disposing_the_borrowed_client'] = 1
          }
          if ($results.Count -eq 0 -or @($results | Where-Object outcome -ne Passed).Count -gt 0) {
            throw 'Every discovered test must execute and pass; empty or skipped runs are invalid.'
          }
          if (@($results.testName | Select-Object -Unique).Count -ne $results.Count) {
            throw 'Duplicate test cases cannot replace required coverage.'
          }
          foreach ($case in $required.GetEnumerator()) {
            $matching = @($results | Where-Object testName -match "\.$($case.Key)(\(|$)")
            if ($matching.Count -ne $case.Value) { throw "Missing or duplicate cases for $($case.Key)." }
          }
        displayName: 'Require named cases and reject empty or skipped TRX runs'
      - pwsh: |
          $consumer = 'compatibility/SqsConsumer/SqsCompatibilityConsumer.csproj'
          $framework = if ($IsWindows) { 'net48' } else { 'net10.0' }
          dotnet build $consumer -c Release --framework $framework
          if ($LASTEXITCODE -ne 0) { throw 'Old consumer compilation failed.' }
          $output = "compatibility/SqsConsumer/bin/Release/$framework"
          $binary = if ($IsWindows) { "$output/SqsCompatibilityConsumer.exe" } else { "$output/SqsCompatibilityConsumer.dll" }
          $before = (Get-FileHash $binary).Hash
          $originalBinary = Join-Path '$(Agent.TempDirectory)' ([IO.Path]::GetFileName($binary))
          Copy-Item $binary $originalBinary -Force
          if ($IsWindows) { & $binary } else { dotnet $binary }
          if ($LASTEXITCODE -ne 0) { throw 'Released-package consumer execution failed.' }

          dotnet pack src/AWS/SQS/Akka.Streams.SQS/Akka.Streams.SQS.csproj -c Release -p:PackageVersion=1.5.59-sqs-validation -o SqsPackages
          if ($LASTEXITCODE -ne 0) { throw 'Package creation or API/TFM validation failed.' }
          $feed = (Resolve-Path SqsPackages).Path
          $candidateCache = Join-Path '$(Agent.TempDirectory)' ("sqs-consumer-{0}-{1}-packages" -f $framework, [guid]::NewGuid().ToString('N'))
          # Resolve dependencies and binding configuration for the consumer's own TFM.
          dotnet build $consumer -c Release --framework $framework --force --no-incremental -p:SqsConsumerPackageVersion=1.5.59-sqs-validation "-p:RestoreAdditionalProjectSources=$feed" "-p:RestorePackagesPath=$candidateCache"
          if ($LASTEXITCODE -ne 0) { throw 'Consumer source is incompatible with the candidate package.' }
          $resolvedPackage = Join-Path $candidateCache 'akka.streams.sqs/1.5.59-sqs-validation/akka.streams.sqs.1.5.59-sqs-validation.nupkg'
          $builtPackage = Join-Path $feed 'Akka.Streams.SQS.1.5.59-sqs-validation.nupkg'
          if ((Get-FileHash $resolvedPackage).Hash -ne (Get-FileHash $builtPackage).Hash) { throw 'Consumer resolved a different candidate package.' }
          $libraryFramework = if ($IsWindows) { 'netstandard2.0' } else { 'net6.0' }
          $candidate = "src/AWS/SQS/Akka.Streams.SQS/bin/Release/$libraryFramework"
          Copy-Item $originalBinary $binary -Force
          if ((Get-FileHash $binary).Hash -ne $before) { throw 'Consumer was changed after compilation.' }
          if ((Get-FileHash "$output/Akka.Streams.SQS.dll").Hash -ne (Get-FileHash "$candidate/Akka.Streams.SQS.dll").Hash) {
            throw 'Consumer did not receive the candidate library.'
          }
          if ($IsWindows) { & $binary } else { dotnet $binary }
          if ($LASTEXITCODE -ne 0) { throw 'Previously compiled consumer failed with the candidate.' }
        displayName: 'Validate API/TFMs and run unchanged released-package consumer with candidate'
      - pwsh: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packages = @(Get-ChildItem SqsPackages/*.nupkg)
          if ($packages.Count -ne 1) { throw 'Expected exactly one SQS package.' }
          $package = $packages[0]
          $archive = [IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $nuspecEntry = @($archive.Entries | Where-Object FullName -like '*.nuspec')
            if ($nuspecEntry.Count -ne 1) { throw 'Expected exactly one package manifest.' }
            $reader = [IO.StreamReader]::new($nuspecEntry[0].Open())
            try { [xml]$nuspec = $reader.ReadToEnd() } finally { $reader.Dispose() }
            if ($nuspec.package.metadata.id -ne 'Akka.Streams.SQS') { throw 'Unexpected package identity.' }
            $version = $nuspec.package.metadata.version
            $readmePath = [string]$nuspec.package.metadata.readme
            if (!$readmePath) { throw 'NuGet manifest does not declare a README.' }
            $entry = $archive.GetEntry($readmePath)
            if (!$entry) { throw 'README is absent from NuGet archive.' }
            $reader = [IO.StreamReader]::new($entry.Open())
            try { $readme = $reader.ReadToEnd() } finally { $reader.Dispose() }
            $sourceReadme = Get-Content src/AWS/SQS/Akka.Streams.SQS/README.md -Raw
            if ($readme -cne $sourceReadme) { throw 'Packaged README differs from the source.' }
            foreach ($tfm in @('net6.0', 'netstandard2.0')) {
              if (!$archive.GetEntry("lib/$tfm/Akka.Streams.SQS.dll")) { throw "Missing retained TFM $tfm." }
            }
          } finally { $archive.Dispose() }

          $examples = [regex]::Matches($readme, '(?s)```csharp\r?\n(.*?)```')
          if ($examples.Count -ne 2) { throw 'Expected two complete README examples.' }
          $feed = [Security.SecurityElement]::Escape((Resolve-Path SqsPackages).Path)
          $cache = [Security.SecurityElement]::Escape((Join-Path '$(Agent.TempDirectory)' ("sqs-readme-{0}-packages" -f [guid]::NewGuid().ToString('N'))))
          for ($i = 0; $i -lt $examples.Count; $i++) {
            $directory = Join-Path '$(Agent.TempDirectory)' "sqs-readme-$i"
            New-Item $directory -ItemType Directory -Force | Out-Null
            Set-Content "$directory/Program.cs" $examples[$i].Groups[1].Value
            Set-Content "$directory/Example.csproj" "<Project Sdk='Microsoft.NET.Sdk'><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable><RestoreSources>$feed;https://api.nuget.org/v3/index.json</RestoreSources><RestorePackagesPath>$cache</RestorePackagesPath></PropertyGroup><ItemGroup><PackageReference Include='Akka.Streams.SQS' Version='$version' /></ItemGroup></Project>"
            dotnet build "$directory/Example.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { throw "README example $i did not compile." }
          }
        displayName: 'Inspect NuGet README/TFMs and compile the shipped examples'
      - task: PublishTestResults@2
        condition: always()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: SqsResults/*.trx
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: true
