            XmlCoalesce_support_must_properly_unify_a_chain_of_CDATA_and_character_chunks = 1
            XmlCoalesce_support_must_properly_unify_a_chain_of_CDATA_chunks = 1
            XmlCoalesce_support_must_properly_unify_a_chain_of_character_chunks = 1
